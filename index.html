<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d81b23">
<meta name="description" content="Impro-Fundus: Warm-ups, Übungen, Szenenspiele und Vorgaben für Improtheater.">
<title>Impro-Fundus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--red:#d81b23;--maroon:#8e2639;--bg:#ffffff;--card:#f4f4f2;--field:#f4f4f2;--line:#e3e2df;--fg:#161616;--muted:#6f6e6b;--ok:#2e9e5b;--no:#8e2639;--hintbg:#fff7e0;--overlay:rgba(0,0,0,.45);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0c;--card:#1b1b1c;--field:#232325;--line:#2d2d30;--fg:#f2f2f2;--muted:#9b9a97;--ok:#2e9e5b;--no:#a8324a;--hintbg:#3a3320;--overlay:rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-family:Gaegu,cursive;font-size:clamp(32px,5vw,46px);font-weight:700}
h2{font-family:Gaegu,cursive;font-size:28px;font-weight:700}
h3{font-size:18px;font-weight:700}

/* Kopfzeile */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:24px;height:24px}
.logo{font-family:Gaegu,cursive;font-weight:700;font-size:28px;color:var(--red);line-height:1;white-space:nowrap}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:44px;max-width:460px;margin-left:auto}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px}
.loginbtn{display:inline-flex;align-items:center;background:var(--red);color:#fff;border-radius:14px;padding:0 16px;height:44px;font-weight:700;text-decoration:none;white-space:nowrap}

/* Aufbau */
.shell{display:flex;min-height:calc(100dvh - 65px)}
.side{display:none}
main{flex:1;min-width:0;padding:20px 16px 110px}
.inner{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* Schublade (Handy) */
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,86%);background:var(--bg);border-right:1px solid var(--line);z-index:40;transform:translateX(-102%);transition:transform .2s ease;overflow-y:auto;padding:16px 12px 24px;display:flex;flex-direction:column;gap:4px}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:30}
.scrim[hidden]{display:none}

/* Untere Leiste (Handy) */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 0;color:var(--muted);border-radius:12px}
.bottom button.on{color:var(--red);font-weight:700}
.bottom svg{width:24px;height:24px}

/* Computer: feste Seitenleiste */
@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:4px;width:290px;flex:none;border-right:1px solid var(--line);padding:20px 12px 24px;position:sticky;top:65px;height:calc(100dvh - 65px);overflow-y:auto;align-self:flex-start}
  main{padding:32px 44px 60px}
  .drawer,.bottom,.menu-btn,.scrim{display:none!important}
}

/* Navigation */
.navbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;font-size:16px}
.navbtn:hover{background:var(--card)}
.navbtn.on{background:var(--red);color:#fff;font-weight:700}
.navbtn .count{font-size:13px;color:var(--muted)}
.navbtn.on .count{color:#fff}
.navbtn .chev{transition:transform .15s;color:var(--muted);flex:none}
.navbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.lbl{font-size:13px;color:var(--muted);padding:14px 12px 4px;text-transform:uppercase;letter-spacing:.06em}
.subs{display:flex;flex-direction:column;margin:2px 0 6px 18px;padding-left:12px;border-left:2px solid var(--line)}
.subs .navbtn{font-size:15px;padding:7px 10px}
.memberbox{margin-top:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.memberbox p{margin:0;font-size:14px;color:var(--muted)}

/* Karten und Inhalte */
.hero{display:flex;flex-direction:column;gap:10px}
.hero p{margin:0;color:var(--muted);max-width:60ch;font-size:17px}
.eyebrow{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tile,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.tile:hover,.card:hover{border-color:var(--red)}
.tile p,.card p{margin:0;color:var(--muted);font-size:15px}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.list{display:flex;flex-direction:column;gap:10px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:12px;color:var(--muted);margin-left:6px;vertical-align:middle;white-space:nowrap}
.pill.red{background:var(--red);border-color:var(--red);color:#fff}
.pill.todo{color:var(--no);border-color:var(--no)}
.crumb{font-size:14px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb button{color:var(--red);text-decoration:underline;text-underline-offset:3px}
.pagehead{display:flex;flex-direction:column;gap:6px}
.pagehead p{margin:0;color:var(--muted);max-width:62ch}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chip.small{padding:3px 10px;font-size:13px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.detail{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:18px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fact{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.fact span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fact strong{font-size:15px}
.prose{display:flex;flex-direction:column;gap:10px}
.prose p{margin:0}
.tip{border-left:4px solid var(--red);padding:10px 14px;background:var(--hintbg);border-radius:0 12px 12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:16px}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.linkbtn{color:var(--red);text-decoration:underline;text-underline-offset:3px;font-weight:700}
.gen{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.gen-slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.slot{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.slot span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.slot strong{font-family:Gaegu,cursive;font-size:22px}
.taglist{display:flex;flex-wrap:wrap;gap:8px}
.taglist span{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:15px}
form{display:flex;flex-direction:column;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:15px}
.field small{color:var(--muted);font-weight:400}
.field input,.field select,.field textarea{background:var(--field);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;width:100%}
.field textarea{min-height:120px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{margin-top:4px;width:18px;height:18px}
.err{color:var(--no);font-size:14px}
.note{font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:14px;padding:12px 14px}
.notice{background:var(--card);border:1px solid var(--ok);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px}
.bank{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.bank dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.bank dt{font-size:13px;color:var(--muted);text-transform:uppercase;padding-top:2px}
.bank dd{margin:0;font-family:ui-monospace,Menlo,monospace;font-size:15px;overflow-wrap:anywhere}
.empty{color:var(--muted);text-align:center;padding:28px;border:1px dashed var(--line);border-radius:18px}
</style>
</head>
<body>

<header class="top">
  <button class="iconbtn menu-btn" id="menuBtn" aria-label="Menü öffnen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <button class="logo" data-go="start" aria-label="Zur Startseite">Impro-Fundus</button>
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="Spiel oder Vorgabe suchen" aria-label="Suchen">
  </label>
  <a class="loginbtn" href="app/">Anmelden</a>
</header>

<div class="shell">
  <aside class="side" id="side" aria-label="Hauptmenü"></aside>
  <main id="main"></main>
</div>

<aside class="drawer" id="drawer" aria-label="Menü"></aside>
<div class="scrim" id="scrim" hidden></div>
<nav class="bottom" id="bottom" aria-label="Schnellmenü"></nav>

<script>
const DATA={"items": [{"id": "u1", "cat": "szenen", "sub": "sprache", "title": "Grommolo Übersetzer", "ex": 3, "von": null, "bis": null, "level": "Fortgeschritten", "ab": "Eine Person spricht ganz normales Deutsch.\n\nDie zweite Person kommt aus dem Gromolo-Land und spricht nur Gromolo (eine frei erfundene Fantasiesprache).\n\nDie dritte Person ist der Übersetzer und übersetzt hin und her.\n\nIhr spielt zusammen eine improvisierte Szene. Der Gromolo-Sprecher nutzt viel Mimik und Gestik."}, {"id": "u2", "cat": "szenen", "sub": "sprache", "title": "Grommolo Switch", "ex": 2, "von": null, "bis": null, "level": "Fortgeschritten", "ab": "Zwei Spieler beginnen eine normale Szene mit deutsch. Wenn der Spielleiter ein Zeichen gibt, also z.B. klatscht, müssen sie sofort, also ohne Unterbrechung/Sprechpause in Gromolo (Kauderwelsch) wechseln. Klatscht der Spielleiter nach wenigen Sekunden erneut, geht es wieder zurück auf deutsch usw. immer hin und her. Diese Wechsel müssen wie selbstverständlich im Sprechfluss und ohne jegliche Hervorhebung passieren.\n\nDer Switch kann beliebig oft stattfinden, die Dauer der Gromolo/deutsch-Parts darf unterschiedlich lang sein. Auch während der Gromolophase muss die Szene weiterlaufen. Wichtig ist auch, dass die einzelnen Phasen (deutsch/Gromolo) nicht zu lang sind und gegen Ende der Szene zunehmend kürzer werden."}, {"id": "u3", "cat": "szenen", "sub": "figuren", "title": "Drei Tote", "ex": null, "von": 3, "bis": 4, "level": "Fortgeschritten", "ab": "Drei (oder vier) Spieler stellen sich in einer Reihe auf die Bühne und für jeden wird vom Publikum eine Todesart abgefragt. Die Spieler stellen nun die Toten dar, die erzählen, wie es zu ihrem Tod gekommen ist. Ziel ist, dass alle zur gleichen Zeit am gleichen Ort sterben.\n\nAlle Spieler drehen sich jetzt um und stehen mit dem Rücken zum Publikum. Der Erste dreht sich um und stellt seine Figur kurz vor. Dann dreht er sich wieder um und der nächste stellt sich vor bis alle einmal durch sind. In dieser ersten Runde soll einfach nur der Charakter der Figur definiert werden. Die Figuren können miteinander verwandt sein, sie können aber auch völlig unabhängig voneinander sein.\n\nIn der zweiten Runde wird der Ort eingeführt, es drehen sich wieder alle nacheinander um und erzählen. Der erste Spieler führt mit seiner Erzählung den Ort ein, die anderen übernehmen den Ort. Im besten Falle sind am Ende der Runde alle an einem Ort und können in der dritten und letzten Runde alle erzählen, wie sie gestorben sind."}, {"id": "u4", "cat": "szenen", "sub": "sprache", "title": "Letztes Wort, erstes Wort", "ex": 2, "von": null, "bis": null, "level": "Fortgeschritten", "ab": "An diesem Spiel sind zwei Spieler beteiligt. Es wird eine beliebige Vorgabe eingeholt. Das Besondere ist, dass im Dialog der beiden das jeweils letzte Wort des einen Spielers das erste des anderen sein muss.\n\nBeispiel:\n\nA: Wie komme ich denn zum Bahnhof?\n\nB: Bahnhof — lassen sie mich überlegen. Sie gehen erst nach links, dann liegt auf der rechten Seite eine Treppe, die gehen sie hoch.\n\nA: Hoch gelegen der Bahnhof, was?\n\nB: Was meinen sie, wie mich das immer anstrengt.\n\nusw."}, {"id": "u5", "cat": "szenen", "sub": "sprache", "title": "ABC Spiel", "ex": 2, "von": null, "bis": null, "level": "Fortgeschritten", "ab": "Basisspiel\n\nDas jeweils erste Wort im Dialog beginnt mit dem nächsten Buchstaben im Alphabet. Das Spiel geht bis der Buchstabe „Z“ erreicht ist. Das ABC-Spiel ist daher auch unter dem Namen Alphabetspiel bekannt.\n\nBeispiel:\n\nErster Spieler: „Abends bekomme ich immer Hunger. Das ist nicht gut für meine Figur!“\n\nZweiter Spieler: „Besonders lecker finde ich Schnitzel.“\n\nErster Spieler: „Currywurst esse ich lieber. Am Besten mit Pommes.“\n\nusw.\n\nVariante 2:\n\nJeder Satz beginnt mit dem nächsten Buchstaben."}, {"id": "u6", "cat": "szenen", "sub": "sprache", "title": "Drei Regeln", "ex": null, "von": 2, "bis": 3, "level": "Fortgeschritten", "ab": "Der Moderator fragt drei personenbezogene Regeln ab, die die Spieler in der Szene beachten sollen. Zum Beispiel, dass sie nur einen Arm haben, kein Wort sprechen dürfen, das ein „s“ enthält und verliebt sein sollen.\n\nGegebenenfalls kann man auch gezielt abfragen: Also z.B. nach körperlicher Besonderheit – welchen Buchstaben weglassen (es empfiehlt sich, keine Vokale zu nehmen, also gleich nach Konsonanten zu fragen)? – welches Gefühl?\n\nRegeln:\n\n1. Jeder Satz muss als Frage enden. Beispiel: „Der Peter geht jetzt in die Küche, oder?“\n\n2. Jeder Satz beginnt mit „Und dann“. Beispiel: „Und dann greift der Bernd zur Tasse.“\n\n3. Sie dürfen die Wörter „Nein“, „nicht“, „kein“, „nichts“, „niemals“ etc. nicht benutzen. (keine Verneinungen) Beispiel: Statt „Ich habe keinen Hunger“ musst du eher sagen „Ich bin satt.“\n\n4. Sie sprechen nur in der dritten Person über sich selbst. Beispiel: „Die Anna freut sich sehr.“ statt „Ich freue mich sehr.“\n\n5. Jede Aussage muss übertrieben höflich und formell sein. Beispiel: „Verehrteste Kollegin, dürfte ich mir erlauben, Ihnen mitzuteilen, dass es mir eine außerordentliche Freude bereitet…?“\n\n6. Jeder Satz muss eine Metapher enthalten. Beispiel: „Das Herz des Thomas ist ein brodelnder Vulkan.“ / „Die Anna ist ein leuchtender Stern in der Dunkelheit.“\n\n7. Jeder Satz muss einen Vergleich enthalten. Beispiel: „Der Bernd läuft schnell wie ein gehetzter Hase.“ / „Ihr Lächeln ist warm wie die Sonne.“\n\n8. Jeder Satz muss mit „Plötzlich“ beginnen. Beispiel: „Plötzlich betritt der Klaus den Raum.“ / „Plötzlich spürt sie große Freude.“\n\n9. Jeder Satz muss exakt vier Wörter lang sein. Beispiel: „Der Max öffnet die Tür.“ / „Anna nimmt den Apfel jetzt.“\n\n10. Man darf keine Artikel verwenden. (der, die, das, ein, eine, dem, den etc.) Beispiel: „Max öffnet Tür langsam.“ / „Anna trinkt Kaffee gerne.“\n\n11. Ein bestimmter Buchstabe ist verboten. (das Publikum legt vorher einen Buchstaben fest, z. B. „R“) Beispiel (bei Verbot von „R“): Die Spieler müssen Wörter finden, in denen dieser Buchstabe nicht vorkommt. Statt „Tür“ könnte man z. B. sagen „Zugang“ oder „Eingang“. Statt „Fenster“ könnte man „Scheibe“ oder „Glas“ sagen."}, {"id": "u7", "cat": "szenen", "sub": "replay", "title": "Tod in einer Minute (30, 15, 10, 5)", "ex": 2, "von": null, "bis": null, "level": "Fortgeschritten", "ab": "Tod in einer Minute ist eine Variante des Spiels „Halbwertszeit“.\n\nZwei Spieler beginnen eine Szene (evtl. mit Vorgaben des Publikums) bei der innerhalb einer Minute eine der beiden Figuren sterben muss. Nun wird die selbe Szene wiederholt, jedoch wird jetzt nur noch eine halbe Minute gespielt. Dann 15 Sekunden, 8, 4, 2, 1 Sekunden."}, {"id": "u8", "cat": "szenen", "sub": "replay", "title": "Gefühlsreplay", "ex": null, "von": 2, "bis": 3, "level": "Fortgeschritten", "ab": "Mit Vorgabe einer alltäglichen Handlung (oder etwas anderes) wird von zwei bis drei Spielern eine kurze Szene gespielt.\n\nDiese wird danach zwei oder dreimal verschieden gefühlsbetont wiederholt (Replay).\n\nDabei ist die Wahl der Gefühle dem Publikum überlassen, man sollte aber möglichst gegensätzliche Gefühle wählen.\n\nBeispiel für Gefühle: verliebt, wütend, müde, durchgedreht, albern…"}, {"id": "u9", "cat": "szenen", "sub": "replay", "title": "Genrereplay", "ex": null, "von": 2, "bis": 3, "level": "Fortgeschritten", "ab": "Deine Genre Replay Liste:\n\n1. Seifenoper\nÜbertrieben dramatisches Daily Soap-Feeling.\nTipps: Starke Emotionen, lange dramatische Pausen, viel Seufzen, dramatische Kopfbewegungen, übertriebene Liebes- oder Hass-Erklärungen. Sprich sehr affektiert und laut.\n\n2. Shakespeare-Drama\nKlassisches Theater im Stil von Shakespeare.\nTipps: Verwende altertümliche, poetische Sprache („Oh holde Maid!“, „Weh mir!“). Sprich theatralisch, mit großen Gesten und viel Pathos. Stehe würdevoll und dramatisch.\n\n3. Musical\nAlles wird gesungen statt gesprochen.\nTipps: Singt eure Dialoge (auch improvisiert). Übertreibt die Melodie und Emotion. Macht große Musical-Gesten mit den Armen. Ihr könnt auch zusammen im Chor singen.\n\n4. Stummfilm\nKein gesprochenes Wort – nur Mimik und Gestik.\nTipps: Übertriebene, cartoonartige Gesichtsausdrücke und Bewegungen. Macht alles sehr groß. Ihr könnt Zwischentitel andeuten (z. B. mit imaginären Tafeln).\n\n5. Reality-TV\nKünstlich aufgeheizte Realityshow.\nTipps: Sprecht direkt in die (imaginäre) Kamera, dramatisiert alles extrem, verwendet Phrasen wie „Ich kann nicht glauben, dass du das gemacht hast!“, viel Genervt-Sein und künstliche Tränen.\n\n6. Talkshow\nEine Person ist Moderator, die andere der Gast.\nTipps: Der Moderator stellt übertriebene Fragen und reagiert begeistert/schockiert. Der Gast erzählt dramatisch oder arrogant. Viel Blickkontakt zum Publikum.\n\n7. Kinderfernsehen\nFröhliches, einfaches und naives Kinderprogramm.\nTipps: Sehr hohe, fröhliche Stimmen, einfache Sprache, viel Lächeln und Begeisterung. Macht große, langsame Gesten und erklärt alles überdeutlich.\n\n8. Erstes Date\nSchüchternes, peinliches oder aufgeregtes erstes Treffen.\nTipps: Stottern, lange Pausen, nervöses Lachen, sich verhaspeln, Komplimente, die schiefgehen. Viel Körpersprache (Hände knetschen, Haare hinters Ohr streichen).\n\n9. Comedy (Sitcom-Stil)\nLeichte, witzige amerikanische Comedyserie.\nTipps: Schnelle Dialoge, Pointen, übertriebene Reaktionen, Slapstick-Elemente und viel Timing. Schaut das Publikum an, wenn ein Witz kommt.\n\n10. Horror\nGruselig und bedrohlich.\nTipps: Flüstert viel, macht lange Pausen, sprecht langsam und unheimlich. Nutzt tiefe Stimmen, starre Blicke und langsame, bedrohliche Bewegungen.\n\n11. Krimi\nSpannender Detektiv- oder Verhör-Stil.\nTipps: Misstrauische Blicke, harte, kurze Sätze, viel Andeutungen („Ich weiß, was du getan hast…“). Eine Person kann der Ermittler, die andere der Verdächtige sein.\n\n12. Opa (Alte-Leute-Stil)\nZwei alte Omas oder Opas im Gespräch.\nTipps: Sprecht langsam, nuschelt etwas, verwendet alte Ausdrücke („Früher war alles besser…“). Krummen Rücken, zittrige Bewegungen, meckern und jammern viel.\n\n13. Bollywood\nEmotionales, dramatisches indisches Kino.\nTipps: Sehr große Emotionen, dramatische Gesten, viel Pathos und Leidenschaft. Singt zwischendurch kurz (oder tut so), sprecht gefühlvoll und übertrieben."}, {"id": "u10", "cat": "szenen", "sub": "sprache", "title": "Gebärdendolmetscher", "ex": 3, "von": null, "bis": null, "level": "Fortgeschritten", "ab": "In der Szene wird eine beliebige Interviewsituation dargestellt, beispielsweise wird ein Experte zu einem bestimmten Thema befragt. Das Besondere ist, dass ein dritter Spieler das Erzählte für Gehörlose „übersetzt“ und die entsprechenden passenden Gesten, Gesichtsausdrücke und Bewegungen macht.\n\nDas Spiel steht und fällt mit dem Körpereinsatz und Einfallsreichtum des Gebärdendolmetschers, der im Wesentlichen den Fokus hat."}, {"id": "u11", "cat": "szenen", "sub": "replay", "title": "Aus der Sicht von", "ex": 3, "von": null, "bis": null, "level": "Fortgeschritten", "ab": "Ein Replayspiel mit 3 Spielern. Man beginnt mit einer neutralen Szene, die relativ kurz sein sollte. Die Figuren sollten klar dargestellt sein. Wenn die Szene beendet ist, wird sie wiederholt aus der Sicht eines der drei Spieler. Das heißt, dass die anderen zwei versuchen, die Weltsicht, die Wahrnehmungen und Empfindungen dieser Figur, so wie sie sie aus ihrem Spielen in der ersten Szene wahrgenommen haben (ggf. nur aus Andeutungen), größer bzw. deutlicher zu machen. Wenn z.B. in der Anfangsszene die Mutter der Tochter streng verboten hat, nach 23 Uhr nach Hause zu kommen und die Spieler merkten, dass die Tochter das gemein und streng fand, dann könnte die Mutter in der Folgeszene, in der die Tochter „bespielt“ wird, ihre Figur strenger und gemeiner anlegen als in der Ausgangsszene. Entsprechend wird in Bezug auf die anderen zwei Spieler verfahren."}, {"id": "u12", "cat": "grundlagen", "sub": "jaund", "title": "Akzeptieren", "ex": null, "von": 2, "bis": 3, "level": "Fortgeschritten", "ab": "2–3 Personen\n\nIhr spielt eine normale improvisierte Szene.\n\nWichtigste Regel: Alles, was der andere sagt oder vorschlägt, musst du sofort akzeptieren und darauf aufbauen.\n\nKein „Nein“, kein Ablehnen, kein Korrigieren.\n\nImmer „Ja, und…“\n\nZiel: Gemeinsam eine verrückte, stimmige Szene erschaffen."}, {"id": "u13", "cat": "grundlagen", "sub": "jaund", "title": "Au Ja!", "ex": 2, "von": null, "bis": null, "level": "Fortgeschritten", "ab": "2 Personen\n\nBeide stehen nebeneinander vor dem Publikum und beginnen gemeinsam, eine Tätigkeit auszuführen (z.B. Kuchen backen, ein Regal aufbauen, ein Auto reparieren).\n\nJeder Satz beginnt mit „Au ja, und dann…“. Nach dem „Au ja, und dann“ folgt eine Beschreibung, was als nächstes getan wird. Die Tätigkeit wird auch tatsächlich pantomimisch ausgeführt.\n\nBeispiel:\n\nA: „Au ja, und dann holen wir die Eier aus dem Kühlschrank.“\n\nB: „Au ja, und dann schlagen wir die Eier in die Schüssel.“\n\nA: „Au ja, und dann rühren wir den Teig.“\n\nusw.\n\nDie Sätze müssen also logisch aufeinander aufbauen."}, {"id": "u14", "cat": "grundlagen", "sub": "erzaehlen", "title": "Geschichten gleichzeitig erzählen", "ex": 2, "von": null, "bis": null, "level": "Fortgeschritten", "ab": "Eine Übung für zwei Spieler.\n\nBeide beginnen gleichzeitig mit dem ersten Satz ihrer Geschichte.\n\nDann erzählt Spieler 1 die Geschichte von Spieler 2 weiter, indem er mit dem zweiten Satz der Geschichte von Spieler 2 fortfährt. Gleichzeitig erzählt Spieler 2 den zweiten Satz der Geschichte von Spieler 1 weiter.\n\nSpieler 1: „Es war einmal ein kleiner Marienkäfer.“\nGleichzeitig sagt Spieler 2: „Es war Thomas Geburtstag und er hatte seinen einzigen Freund eingeladen.“\n\nDann\nSpieler 1: „Sein Freund hatte ihm als Geschenk 2 Flugtickets nach Mallorca mitgebracht.“\nGleichzeitig sagt Spieler 2: „Der Marienkäfer lebte zusammen mit seinen Geschwistern auf einem kleinen Blatt…“\n\nSo geht es nun immer hin und her. Die Sätze sollten möglichst kurz sein, damit das gleichzeitige Erzählen ausbalanciert ist.\n\nDiese Übung erfordert gutes Zuhören und sofortiges Behaupten."}, {"id": "u15", "cat": "szenen", "sub": "wechsel", "title": "Orte Switch", "ex": 2, "von": null, "bis": null, "level": "Fortgeschritten", "ab": "2 Personen + Moderator\n\nZwei Spieler improvisieren eine Szene an einem bestimmten Ort.\n\nDer Moderator ruft zwischendurch „Switch!“ und nennt einen neuen Ort (z. B. „Switch – ihr seid jetzt auf dem Mond!“ oder „Switch – ihr seid jetzt im Supermarkt!“).\n\nDie Spieler müssen sofort an dem neuen Ort weiterspielen und improvisieren, warum sie plötzlich dort sind und wie die Szene dort weitergeht.\n\nZiel: Schnelle, kreative Ortswechsel mit lustigen Übergängen."}, {"id": "u16", "cat": "szenen", "sub": "replay", "title": "Day before – Day after", "ex": 2, "von": null, "bis": null, "level": "Fortgeschritten", "ab": "2 Personen\n\nEine alltägliche oder absurde Situation wird zweimal gespielt: einmal als „Tag davor“ und einmal als „Tag danach“.\n\nBeispiel: Ein Paar streitet sich über eine Urlaubsreise. Die erste Szene zeigt die Planung, die zweite die Rückkehr.\n\nDer Fokus liegt darauf, wie sich Beziehungen, Stimmung und Details verändert haben."}, {"id": "u17", "cat": "warmup", "sub": "rhythmus", "title": "Big Booty", "ex": null, "von": 4, "bis": 12, "level": "Einsteiger", "ab": "Big Booty ist so ein Aufwärm-Klassiker, der von außen total albern aussieht und einen drinnen trotzdem ganz schön schwitzen lässt. Im Grunde ist es ein Sprech-Rhythmus-Spiel, bei dem man kurz seine eigene Nummer sagt, dann jemand anderen aufruft, und das alles im Takt der Gruppe. Klingt einfach. Ist es nicht.\n\nWir stellen uns im Kreis auf und nummerieren uns durch. Der erste ist Big Booty, danach kommen Number 1, Number 2, Number 3 und so weiter. Big Booty gibt das Tempo vor, der Rest hält es. Wer dran ist, ruft im Takt erst sich selbst, dann denjenigen, an den er die heiße Kartoffel weiterreicht.\n\nGeht so:\n\nAlle: Big Booty, Big Booty, Big Booty — ooooh yeah\nBig Booty: Big Booty → Number 4\nNumber 4: Number 4 → Big Booty\nBig Booty: Big Booty → Number 2\nNumber 2: Number 2 → Number 3\n\nAlle: Aiaiai!"}, {"id": "u18", "cat": "warmup", "sub": "geschichten", "title": "4-Satzgeschichte", "ex": 4, "von": null, "bis": null, "level": "Fortgeschritten", "ab": "Die Spieler stellen sich im Kreis oder in einer Reihe auf, um kurze Geschichten zu erzählen.\n\nDabei sagt jeder Spieler jeweils nur einen Satz.\n\nDie 4 Sätze sind nach dem Modell aufgebaut:\n\nEinleitung/Routine => Problem => Lösung => Moral\n\nDabei beginnt Spieler 1 mit dem Einleitungssatz, z.B.:\n\n„Es war einmal in Japan, da zog ein junger Samurai in seinen ersten großen Kampf.“\n\nSpieler 2 etabliert jetzt in seinem Satz das Problem, z.B.:\n\n„Der Samurai hatte jedoch große Angst vor dem Tod, bettelte um Gnade und ergab sich seinem Gegner und wurde daraufhin von allen verachtet und mit Schande bedacht.“\n\nSpieler 3 etabliert jetzt in seinem Satz die Lösung, z.B.:\n\n„Bis er als alter Samurai der durch die Erfahrung sehr viel gelernt und die Angst komplett verloren hatte, erneut auf seinen früheren Gegner traf und ihn schließlich doch noch besiegte.“\n\nSpieler 4 fasst jetzt die „Moral der Geschichte“ zusammen, z.B.:\n\n„Und die Moral von der Geschichte: Wer immer wieder aufsteht, wenn er hinfällt, wird irgendwann erfolgreich sein.“\n\nDiese Übung eignet sich gut um ein beliebtes Grundmuster des Geschichtenerzählens zu trainieren und dabei in einem Satz auf den Punkt zu kommen."}, {"id": "u19", "cat": "grundlagen", "sub": "jaund", "title": "Ja, genau und dann …", "ex": 2, "von": null, "bis": null, "level": "Fortgeschritten", "ab": "Zwei Spieler stehen vor dem Publikum, ein dritter sitzt am Bühnenrand.\n\nA und B stehen nebeneinander und erzählen gemeinsam eine Geschichte. Jeder Satz beginnt mit „Ja genau und dann“. A und B steigern sich in die Geschichte hinein.\n\nA: „Ja genau und dann sind wir durch den Wald gelaufen.“ (A und B gehen auf der Stelle)\n\nB: „Ja genau und dann haben wir ein Geräusch gehört.“ (A und B halten inne)\n\nA: „Ja genau und dann haben wir uns umgeschaut.“ (A und B schauen sich um)\n\nA: „Ja genau und dann haben wir ein Handy auf dem Boden gesehen.“ (A und B schauen nach unten und bücken sich)\n\nA: „Ja genau und dann haben wir das Handy aufgehoben.“ (A und B bücken sich)\n\nusw.\n\nDie Sätze müssen logisch aufeinander aufbauen. Wichtig ist, dass A und B die Handlungen, die sie beschreiben, auch pantomimisch ausführen."}, {"id": "u20", "cat": "grundlagen", "sub": "gegen", "title": "Ja, aber …", "ex": 2, "von": null, "bis": null, "level": "Fortgeschritten", "ab": "Bei dieser Übung finden sich die Spieler in Paaren zusammen und führen nun einen Dialog. A macht einen Vorschlag, während B einen Grund findet, den Vorschlag nicht umsetzen zu müssen. Sein Satz beginnt dabei mit „Ja, aber“. Anschließend macht B einen neuen Vorschlag, sodass sich nun A eine Ausrede ausdenken muss.\n\nA: „Lass uns doch gemeinsam die schwere Kiste vom Schrank holen.“\n\nB: „Ja, aber ich habe es doch so schlimm mit dem Rücken. Lass uns lieber ins Schwimmbad gehen.“\n\nA: „Ja aber ich kann doch gar nicht schwimmen…“\n\nBei der Übung geht es darum zu trainieren nicht mit „Nein“ zu antworten und damit komplett zu blocken, sondern stattdessen einen Gegenvorschlag zu machen und seinem Mitspieler Alternativen anzubieten. Auf diese Weise wird die Szene am Leben erhalten, gleichzeitig kann der Spieler unangenehmen Vorschlägen aus dem Weg gehen."}, {"id": "u21", "cat": "szenen", "sub": "wechsel", "title": "Freeze", "ex": 3, "von": null, "bis": null, "level": "Fortgeschritten", "ab": "Zwei Spieler spielen eine Szene. Ein dritter Spieler steht neben der Bühne und ruft jederzeit „Freeze!“. Daraufhin müssen die beiden Spieler sofort in ihrer Bewegung erstarren. Der Spielleiter tippt einen der beiden Spieler an, der sich daraufhin aus der Szene herausnimmt. Der Spielleiter übernimmt dessen Position und Körperhaltung und beginnt eine komplett neue Szene, in der die verbliebene Person mitspielen muss.\n\nWichtig: Die neue Szene sollte möglichst wenig mit der vorherigen zu tun haben. Die erstarrte Haltung des ausgetauschten Spielers muss als Ausgangspunkt für die neue Szene genutzt werden. Die Spieler sollten sich gegenseitig gut beobachten und schnell reagieren."}, {"id": "u22", "cat": "warmup", "sub": "geschichten", "title": "Einwortgeschichte", "ex": null, "von": 4, "bis": 8, "level": "Einsteiger", "ab": "4–8 Personen (im Kreis)\n\nReihum wird immer nur ein Wort gesagt. Gemeinsam entsteht so eine Geschichte.\n\nBeispiel:\n\nA: „Es“ – B: „war“ – C: „einmal“ – D: „ein“ – A: „kleiner“ – B: „Drache“ …\n\nWichtig: Immer nur ein Wort pro Person, kein Satz. Wer dran ist, sagt sofort ein Wort, ohne lange nachzudenken. Am Ende soll die Geschichte einen Abschluss finden.\n\nZiel: Gemeinsames Erzählen, Fokus und schnelles Reagieren."}, {"id": "u23", "cat": "szenen", "sub": "figuren", "title": "Erfinder-Talkshow", "ex": 2, "von": null, "bis": null, "level": "Fortgeschritten", "ab": "2 Personen\n\nEin Spieler ist der Talkshow-Moderator, der andere ist ein verrückter Erfinder.\n\nDer Erfinder präsentiert stolz seine neueste, total abgedrehte Erfindung (z. B. eine Sockenanzziehmaschine, einen Schuhbinden-Roboter oder eine Krawatten-Bindemaschine).\n\nDer Moderator stellt neugierige und überraschte Fragen, der Erfinder erklärt und demonstriert seine Erfindung enthusiastisch.\n\nZiel: Lustige, übertriebene Präsentation einer sinnlosen Erfindung."}, {"id": "u24", "cat": "szenen", "sub": "figuren", "title": "Whose Line is it anyways", "ex": null, "von": 2, "bis": 3, "level": "Fortgeschritten", "ab": ""}, {"id": "u25", "cat": "grundlagen", "sub": "jaund", "title": "Ja und", "ex": 2, "von": null, "bis": null, "level": "Fortgeschritten", "ab": "2 Personen\n\nEin Spieler macht einen Vorschlag oder eine Aussage. Der andere antwortet immer mit „Ja, und …“ und ergänzt eine neue Information.\n\nBeispiel:\n\nA: „Wir fahren jetzt in den Urlaub.“\n\nB: „Ja, und wir haben schon gepackt.“\n\nZiel: Gemeinsam eine Szene aufbauen, ohne zu blocken."}, {"id": "u26", "cat": "szenen", "sub": "figuren", "title": "Experte", "ex": 2, "von": null, "bis": null, "level": "Fortgeschritten", "ab": "2 Personen (mit Moderator)\n\nEin Moderator stellt den Experten Fragen zu einem völlig absurden Thema (z. B. „Wie züchtet man unsichtbare Elefanten?“).\n\nDie Experten antworten möglichst überzeugend und detailliert, als wüssten sie alles.\n\nZiel: Sicheres Auftreten, absurde Details, Spaß am Erfinden."}, {"id": "u27", "cat": "warmup", "sub": "rhythmus", "title": "Trainings", "ex": null, "von": 2, "bis": 6, "level": "Einsteiger", "ab": ""}, {"id": "u28", "cat": "szenen", "sub": "figuren", "title": "Wie war das nochmal?", "ex": null, "von": 2, "bis": 4, "level": "Fortgeschritten", "ab": ""}, {"id": "u29", "cat": "warmup", "sub": "rhythmus", "title": "Toaster-Spiel", "ex": null, "von": 4, "bis": 8, "level": "Einsteiger", "ab": "Toaster, James Bond, Waschmaschine, Mixer"}, {"id": "u30", "cat": "warmup", "sub": "rhythmus", "title": "Wachsmaske", "ex": null, "von": 4, "bis": 8, "level": "Einsteiger", "ab": "Wachsmaske, Whiskey-Mixer, Messwechsel"}, {"id": "u31", "cat": "warmup", "sub": "material", "title": "Die 10 Gebote", "ex": null, "von": 2, "bis": 4, "level": "Fortgeschritten", "ab": "1. Du sollst keine anderen Götter haben neben mir.\n\n2. Du sollst den Namen des Herrn, deines Gottes, nicht missbrauchen.\n\n3. Du sollst den Feiertag heiligen.\n\n4. Du sollst deinen Vater und deine Mutter ehren.\n\n5. Du sollst nicht töten.\n\n6. Du sollst nicht ehebrechen.\n\n7. Du sollst nicht stehlen.\n\n8. Du sollst nicht falsch Zeugnis reden wider deinen Nächsten.\n\n9. Du sollst nicht begehren deines Nächsten Haus.\n\n10. Du sollst nicht begehren deines Nächsten Weib, Knecht, Magd, Vieh noch alles, was dein Nächster hat."}], "v": {"Ticks": [{"t": "Schnipst ständig mit den Fingern", "e": ["körperlich"]}, {"t": "Wackelt permanent mit einem Bein", "e": ["körperlich"]}, {"t": "Reibt sich dauernd die Hände, als wäre ihm kalt", "e": ["körperlich"]}, {"t": "Stottert stark (besonders bei bestimmten Buchstaben)", "e": ["sprachlich"]}, {"t": "Vergisst ständig, was er/sie gerade sagen wollte", "e": ["sprachlich"]}, {"t": "Wiederholt die letzten zwei Wörter des Gegenübers", "e": ["sprachlich"]}, {"t": "Spricht immer in der dritten Person von sich selbst", "e": ["sprachlich"]}, {"t": "Spricht nur in Reimen", "e": ["sprachlich"]}], "Tätigkeiten": [{"t": "Etwas reparieren", "e": ["handwerklich"]}, {"t": "Etwas auf einem Flohmarkt verkaufen", "e": ["alltag"]}, {"t": "Heiratsantrag üben", "e": ["privat"]}, {"t": "Vorstellungsgespräch üben", "e": ["beruflich"]}, {"t": "Streit mit dem Nachbarn", "e": ["privat"]}, {"t": "Yoga machen", "e": ["alltag"]}, {"t": "Jemandem die Bedienung eines Gerätes erklären", "e": ["beruflich"]}, {"t": "Sich beim Kundendienst beschweren", "e": ["beruflich"]}, {"t": "IKEA-Möbel zusammenbauen", "e": ["handwerklich"]}, {"t": "Blumen gießen", "e": ["alltag"]}, {"t": "Zähne putzen", "e": ["alltag"]}, {"t": "Wäsche falten", "e": ["alltag"]}, {"t": "Fenster putzen", "e": ["alltag"]}, {"t": "Schuhe binden", "e": ["alltag"]}, {"t": "Zeitung lesen", "e": ["alltag"]}, {"t": "Etwas suchen", "e": ["alltag"]}], "Phobien": [{"t": "Klaustrophobie / Angst vor engen Räumen", "e": ["Phobie"]}, {"t": "Höhenangst", "e": ["Phobie"]}, {"t": "Angst vor Clowns", "e": ["Phobie"]}, {"t": "Undrophobie – panische Angst vor dem Wort „und“", "e": ["Phobie"]}, {"t": "Stiftkappenphobie – Angst davor, dass die Kappe eines Stiftes verloren geht", "e": ["Phobie"]}, {"t": "Namensphobie – Angst vor dem eigenen Namen", "e": ["Phobie"]}, {"t": "Kleptomanie", "e": ["Manie"]}, {"t": "Pyromanie", "e": ["Manie"]}, {"t": "Mythomanie (zwanghaftes Lügen)", "e": ["Manie"]}, {"t": "Zwanghaftes Zählen", "e": ["Manie"]}, {"t": "Zwanghaftes Ordnen und Sortieren", "e": ["Manie"]}, function navHTML(){
  const b=(on,attrs,label,extra="")=>`<button class="navbtn${on?" on":""}" ${attrs}><span>${label}</span>${extra}</button>`;
  let h=b(S.view==="start",'data-go="start"',"Start");
  h+=`<div class="lbl">Übungen & Spiele</div>`;
  CATS.forEach(c=>{
    const n=ITEMS.filter(i=>i.cat===c.id).length, ex=!!S.open[c.id];
    h+=`<button class="navbtn${S.view==="kat"&&S.cat===c.id&&!S.sub?" on":""}" data-cat="${c.id}" aria-expanded="${ex}"><span>${c.name}</span><span class="row" style="gap:8px"><span class="count">${n}</span>${chev}</span></button>`;
    if(ex)h+=`<div class="subs">${c.subs.map(s=>b(S.view==="kat"&&S.cat===c.id&&S.sub===s[0],`data-cat="${c.id}" data-sub="${s[0]}"`,s[1],`<span class="count">${ITEMS.filter(i=>i.cat===c.id&&i.sub===s[0]).length}</span>`)).join("")}</div>`;
  });
  h+=`<div class="lbl">Vorgaben</div>`;
  h+=`<button class="navbtn" data-vtoggle aria-expanded="${!!S.open.v}"><span>Vorgaben-Sammlung</span><span class="row" style="gap:8px"><span class="count">${vCount()}</span>${chev}</span></button>`;
  if(S.open.v)h+=`<div class="subs">${Object.keys(VORG).map(k=>b(S.view==="vorgaben"&&S.vcat===k,`data-v="${esc(k)}"`,esc(k),`<span class="count">${VORG[k].length}</span>`)).join("")}</div>`;
  h+=`<div class="lbl">Mitmachen</div>`;
  h+=b(S.view==="einreichen",'data-go="einreichen"',"Vorschlag einreichen");
  h+=b(S.view==="spenden",'data-go="spenden"',"Spenden");
  h+=`<div class="memberbox"><strong>Für die Impro-Gruppe</strong><p>Mitglieder melden sich mit Namen und PIN an.</p><a class="btn red block" href="app/">Mitglieder-Anmeldung</a></div>`;
  return h;
}

 item(){const i=ITEMS.find(x=>x.id===S.id),c=catOf(i.cat);
  return `<div class="crumb"><button data-cat="${c.id}">${c.name}</button><span>›</span><button data-cat="${c.id}" data-sub="${i.sub}">${esc(subName(c.id,i.sub))}</button></div>
  <article class="detail"><div class="pagehead"><span><span class="pill red">${esc(subName(c.id,i.sub))}</span>${i.neu?'<span class="pill">Neu · Community</span>':""}</span><h1>${esc(i.title)}</h1></div>
  <div class="facts"><div class="fact"><span>Personen</span><strong>${esc(pers(i))}</strong></div><div class="fact"><span>Niveau</span><strong>${esc(i.level)}</strong></div><div class="fact"><span>Bereich</span><strong>${esc(c.name)}</strong></div></div>
  ${i.ab?`<section class="prose"><h2>So geht's</h2>${prose(i.ab)}</section>`:`<div class="tip"><strong>Hier fehlt noch eine Beschreibung.</strong> Du kennst das Spiel? <button class="linkbtn" data-go="einreichen">Beschreibung einreichen</button></div>`}
  ${i.by?`<p class="meta">Eingereicht von ${esc(i.by)}</p>`:""}</article>
  <div class="row"><button class="btn" data-cat="${c.id}" data-sub="${i.sub}">← Zurück zur Liste</button></div>`},

 vorgaben(){const list=VORG[S.vcat],props=[...new Set(list.flatMap(x=>x.e))],sel=list.filter(x=>S.vprop==="alle"||x.e.includes(S.vprop));
  return `<div class="pagehead"><h1>Vorgaben</h1><p>Anregungen für Szenen. Würfle eine Kombination oder stöbere in den Listen.</p></div>${genHTML()}
  <div class="chips" role="group" aria-label="Vorgaben-Bereich">${Object.keys(VORG).map(k=>`<button class="chip" aria-pressed="${S.vcat===k}" data-v="${esc(k)}">${esc(k)} <span class="meta">${VORG[k].length}</span></button>`).join("")}</div>
  <div class="row"><span class="eyebrow">Eigenschaft</span><div class="chips" role="group" aria-label="Eigenschaft"><button class="chip small" aria-pressed="${S.vprop==="alle"}" data-vp="alle">Alle</button>${props.map(p=>`<button class="chip small" aria-pressed="${S.vprop===p}" data-vp="${esc(p)}">${esc(p)}</button>`).join("")}</div></div>
  <div class="taglist">${sel.map(v=>`<span>${esc(v.t)}</span>`).join("")}</div>`},

 suche(){const q=S.q.toLowerCase();
  const l=ITEMS.filter(i=>(i.title+" "+(i.ab||"")).toLowerCase().includes(q));
  const vs=Object.entries(VORG).flatMap(([k,a])=>a.filter(v=>v.t.toLowerCase().includes(q)).map(v=>[k,v.t]));
  return `<div class="pagehead"><h1>Suche: „${esc(S.q)}“</h1><p>${l.length} Spiele · ${vs.length} Vorgaben</p></div>
  <div class="list">${l.length?l.map(card).join(""):'<div class="empty">Kein Spiel gefunden. Vielleicht magst du es einreichen?</div>'}</div>
  ${vs.length?`<h2>Vorgaben</h2><div class="taglist">${vs.map(([k,t])=>`<span><span class="meta">${esc(k)}</span> ${esc(t)}</span>`).join("")}</div>`:""}`},

 einreichen(){
  if(S.sent)return `<div class="pagehead"><h1>Danke für deinen Vorschlag!</h1></div><div class="notice"><strong>Dein Mail-Programm wurde geöffnet.</strong><span>Schick die Mail ab, dann wird dein Vorschlag geprüft.</span></div><div class="row"><button class="btn" data-again>Noch etwas einreichen</button></div>`;
  const opts=CATS.map(c=>`<optgroup label="${c.name}">${c.subs.map(s=>`<option value="${c.id}|${s[0]}">${s[1]}</option>`).join("")}</optgroup>`).join("");
  const offen=!CONFIG.KONTAKT_MAIL;
  return `<div class="pagehead"><h1>Vorschlag einreichen</h1><p>Ein Spiel, eine Übung oder eine Vorgabe fehlt? Beschreibe sie hier. Wir prüfen den Vorschlag und veröffentlichen ihn danach.</p></div>
  ${offen?'<div class="note">Das Einreichen ist gerade noch nicht eingerichtet.</div>':""}
  <form id="f" novalidate>
   <div class="field"><label for="f-kind">Was möchtest du einreichen?</label><select id="f-kind"><option>Spiel</option><option>Übung</option><option>Vorgabe</option></select></div>
   <div class="field"><label for="f-title">Name</label><input id="f-title" placeholder="z. B. Gefühls-Staffel"></div>
   <div class="field" id="wrap-cat"><label for="f-cat">Bereich</label><select id="f-cat">${opts}</select></div>
   <div class="field" id="wrap-vcat" hidden><label for="f-vcat">Art der Vorgabe</label><select id="f-vcat">${Object.keys(VORG).map(k=>`<option>${esc(k)}</option>`).join("")}</select></div>
   <div class="field"><label for="f-text">Beschreibung und Ablauf</label><textarea id="f-text" placeholder="Wie läuft es ab? Was ist die Regel?"></textarea></div>
   <div class="two" id="wrap-meta"><div class="field"><label for="f-players">Anzahl Personen</label><input id="f-players" placeholder="z. B. 2–4"></div><div class="field"><label for="f-level">Niveau</label><select id="f-level"><option>Einsteiger</option><option>Fortgeschritten</option></select></div></div>
   <div class="two"><div class="field"><label for="f-name">Dein Name <small>(freiwillig)</small></label><input id="f-name"></div><div class="field"><label for="f-mail">E-Mail für Rückfragen <small>(freiwillig)</small></label><input id="f-mail" type="email"></div></div>
   <label class="check"><input type="checkbox" id="f-ok"><span>Ich bin einverstanden, dass mein Vorschlag auf der Website veröffentlicht werden darf.</span></label>
   <p class="err" id="f-err" hidden></p>
   <button class="btn red" type="submit" ${offen?"disabled":""}>Vorschlag absenden</button>
  </form>`},

 spenden(){const s=CONFIG.SPENDE;
  const konto=s.iban
    ? `<dl><dt>Inhaber</dt><dd>${esc(s.inhaber)}</dd><dt>IBAN</dt><dd id="iban">${esc(s.iban)}</dd>${s.bic?`<dt>BIC</dt><dd>${esc(s.bic)}</dd>`:""}<dt>Zweck</dt><dd>${esc(s.zweck)}</dd></dl><div class="row"><button class="btn" data-copy>IBAN kopieren</button><span class="meta" id="copied" aria-live="polite"></span></div>`
    : `<p class="meta">Das Spendenkonto wird hier bald veröffentlicht.</p>`;
  return `<div class="pagehead"><h1>Den Fundus unterstützen</h1><p>Der Impro-Fundus ist kostenlos und werbefrei. Mit einer Spende hilfst du bei Hosting, Pflege und neuen Inhalten.</p></div>
  <section class="bank"><h2>Überweisung</h2>${konto}</section>`},
};

function render(){
  $("#side").innerHTML=navHTML();
  $("#drawer").innerHTML=navHTML();
  $("#bottom").innerHTML=bottomHTML();
  const fn=V[S.view]||V.start;
  $("#main").innerHTML=`<div class="inner">${fn()}</div>`;
  if(S.view==="einreichen"&&!S.sent)bindForm();
}

function bindForm(){
  const k=$("#f-kind"), sync=()=>{const v=k.value==="Vorgabe";$("#wrap-cat").hidden=v;$("#wrap-meta").hidden=v;$("#wrap-vcat").hidden=!v};
  k.onchange=sync; sync();
  const f=$("#f");
  if(!f)return;
  f.onsubmit=e=>{
    e.preventDefault();
    const t=$("#f-title").value.trim(), x=$("#f-text").value.trim(), err=$("#f-err");
    const show=m=>{err.textContent=m;err.hidden=false};
    if(!t||!x)return show("Bitte gib einen Namen und eine Beschreibung ein.");
    if(!$("#f-ok").checked)return show("Bitte bestätige, dass der Vorschlag veröffentlicht werden darf.");
    const [cat,sub]=$("#f-cat").value.split("|");
    const body=[
      "Art: "+k.value,
      "Name: "+t,
      k.value==="Vorgabe" ? "Vorgaben-Art: "+$("#f-vcat").value : "Bereich: "+(catOf(cat).name+" › "+subName(cat,sub)),
      "Personen: "+$("#f-players").value.trim(),
      "Niveau: "+$("#f-level").value,
      "",
      x,
      "",
      "Von: "+($("#f-name").value.trim()||"Anonym")+" "+$("#f-mail").value.trim()
    ].join("\n");
    S.sent=true;
    window.location.href=`mailto:${CONFIG.KONTAKT_MAIL}?subject=${encodeURIComponent("Vorschlag Impro-Fundus: "+t)}&body=${encodeURIComponent(body)}`;
    render();
  };
}

document.addEventListener("click",e=>{
  if(e.target.closest("#menuBtn")){openDrawer();return}
  const t=e.target.closest("button");
  if(!t)return;
  const d=t.dataset;
  if(d.go){go(d.go);return}
  if(d.cat!==undefined){
    const inNav=t.closest(".side,.drawer");
    if(inNav&&d.sub===undefined&&S.view==="kat"&&S.cat===d.cat&&!S.sub){S.open[d.cat]=!S.open[d.cat];render();return}
    go("kat",{cat:d.cat,sub:d.sub||null});return;
  }
  if(d.item){go("item",{id:d.item});return}
  if(d.vtoggle!==undefined){S.open.v=!S.open.v;if(S.open.v&&S.view!=="vorgaben")go("vorgaben");else render();return}
  if(d.v){go("vorgaben",{vcat:d.v,vprop:"alle"});return}
  if(d.vp){S.vprop=d.vp;render();return}
  if(d.roll!==undefined){S.draw=draw();render();return}
  if(d.again!==undefined){S.sent=false;render();return}
  if(d.copy!==undefined){
    const txt=$("#iban").textContent;
    if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>$("#copied").textContent="Kopiert",()=>$("#copied").textContent="Bitte markieren und kopieren");
    return;
  }
});
document.addEventListener("change",e=>{
  if(e.target.id==="lvl"){S.level=e.target.value;render()}
  if(e.target.id==="pp"){S.p=e.target.value;render()}
});
$("#scrim").onclick=closeDrawer;
$("#q").addEventListener("input",e=>{
  S.q=e.target.value.trim();
  if(S.q)go("suche");
  else if(S.view==="suche")go("start");
});
render();
</script>
</body>
</html>
