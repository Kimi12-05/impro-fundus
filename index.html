<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B02E28">
<meta name="description" content="Impro-Fundus: Warm-ups, Übungen, Szenenspiele und Vorgaben für Improtheater.">
<title>Impro-Fundus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--red:#B02E28;--maroon:#8E2220;--bg:#F5F0E8;--card:#FFFFFF;--field:#FFFFFF;--line:#E6DFD4;--fg:#1F1B17;--muted:#6F665D;--ok:#2e9e5b;--no:#8E2220;--hintbg:#fff7e0;--overlay:rgba(0,0,0,.45);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A1714;--card:#2A2622;--field:#2A2622;--line:#3A342E;--fg:#F3ECE3;--muted:#ABA196;--red:#D8564F;--maroon:#D8564F;--ok:#2e9e5b;--no:#a8324a;--hintbg:#3a3320;--overlay:rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;font-weight:400;font-size:clamp(32px,5vw,46px);font-weight:700}
h2{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;font-size:24px;font-weight:400}
h3{font-size:18px;font-weight:700}

/* Kopfzeile */
.topwrap{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:24px;height:24px}
.logo{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;font-weight:700;font-size:28px;color:var(--red);line-height:1;white-space:nowrap}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:16px;padding:0 12px;height:44px;max-width:460px;margin-left:auto}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px}
.rightbox{display:flex;align-items:center;gap:10px;flex:1;min-width:0;justify-content:flex-end}
.loginbtn{display:inline-flex;align-items:center;background:var(--red);color:#fff;border-radius:16px;padding:0 16px;height:44px;font-weight:700;text-decoration:none;white-space:nowrap}

/* Aufbau */
.shell{display:flex;min-height:calc(100dvh - 65px)}
.side{display:none}
main{flex:1;min-width:0;padding:20px 16px 110px}
.inner{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* Schublade (Handy) */
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,86%);background:var(--bg);border-right:1px solid var(--line);z-index:40;transform:translateX(-102%);transition:transform .2s ease;overflow-y:auto;padding:16px 12px 24px;display:flex;flex-direction:column;gap:4px}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:30}
.scrim[hidden]{display:none}
[hidden]{display:none!important}

/* Untere Leiste (Handy) */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 0;color:var(--muted);border-radius:12px}
.bottom button.on{color:var(--red);font-weight:700}
.bottom svg{width:24px;height:24px}

/* Computer: feste Seitenleiste */
@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:4px;width:290px;flex:none;border-right:1px solid var(--line);padding:20px 12px 24px;position:sticky;top:var(--hh);height:calc(100dvh - var(--hh) - 60px);overflow-y:auto;align-self:flex-start}
  main{padding:32px 44px 60px}
  .drawer,.bottom,.menu-btn,.scrim{display:none!important}
  .top{display:grid;grid-template-columns:1fr auto 1fr;gap:16px}
  .logo{justify-self:center}
  .topwrap .topnav{display:flex;height:auto;padding:0;justify-content:center}
  .rightbox{justify-self:stretch;width:100%;min-width:0}
  .search{flex:0 1 380px;width:380px;max-width:380px;min-width:0;margin:0 auto}
  .topnav>button,.dd>button{padding:0 10px}
  .chips.mob{display:none}
}

/* Navigation */
.navbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;font-size:16px}
.navbtn:hover{background:var(--card)}
.navbtn.on{background:var(--red);color:#fff;font-weight:700}
.navbtn .count{font-size:13px;color:var(--muted)}
.navbtn.on .count{color:#fff}
.navbtn .chev{transition:transform .15s;color:var(--muted);flex:none}
.navbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.lbl{font-size:13px;color:var(--muted);padding:14px 12px 4px;text-transform:uppercase;letter-spacing:.06em}
.subs{display:flex;flex-direction:column;margin:2px 0 6px 18px;padding-left:12px;border-left:2px solid var(--line)}
.subs .navbtn{font-size:15px;padding:7px 10px}
.memberbox{margin-top:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.memberbox p{margin:0;font-size:14px;color:var(--muted)}

/* Obere Navigation (Computer) */
.topnav{display:none;align-items:center;gap:2px;padding:0 16px;height:48px;background:var(--bg);overflow:visible}
.topnav>button,.dd>button{height:36px;padding:0 12px;border-radius:10px;font-weight:700;font-size:15px;white-space:nowrap}
.topnav>button:hover,.dd>button:hover,.dd:focus-within>button{background:var(--card)}
.topnav>button.on,.dd>button.on{color:var(--red)}
.dd{position:relative}
.ddmenu{display:none;position:absolute;top:100%;left:0;min-width:260px;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:30}
.dd:hover .ddmenu,.dd:focus-within .ddmenu{display:flex}
.ddmenu button{text-align:left;padding:8px 12px;border-radius:10px;font-size:15px;width:100%}
.ddmenu button:hover{background:var(--card);color:var(--red)}

/* Fußzeile */
.foot{border-top:1px solid var(--line);padding-top:18px;display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px}
.foot button{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.quote{text-align:center;display:flex;flex-direction:column;gap:6px;padding:16px 20px;background:var(--card);border:1px dashed var(--line);border-radius:22px}
.quote p{margin:0;font-family:Caveat,cursive;font-size:24px;line-height:1.3}
.quote .row.center{justify-content:center;margin-top:6px}
.sep{border:0;border-top:1px solid var(--line);margin:0}
.search.big{margin:0;max-width:none;height:52px;width:100%}
.qfoot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.copybtn{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.copybtn svg{width:18px;height:18px}
.copybtn:hover{color:var(--red);background:var(--bg)}
.copybtn.done{color:var(--ok)}
@media (min-width:900px){
  .topwrap{position:fixed;top:0;left:0;right:0}
  :root{--hh:92px}
  .shell{padding-top:var(--hh);min-height:100dvh}
  .side{top:var(--hh)}
  .top .logo img{height:72px}
  main.home{padding:8px 44px 16px}
  .home .inner{gap:12px}
  .home .hero{align-items:center;text-align:center}
  .home .hero h1{font-size:44px}
  .home .quote{padding:12px 20px}
  .home .quote p{font-size:26px}
  .start-grid{gap:18px}
  .home .tile{min-height:100px;padding:12px 16px}
  .home .gen .btn{min-height:40px}
}
@media (min-width:900px) and (max-height:800px){
  .home .tile{min-height:86px}
  .home .inner{gap:10px}
  main.home{padding-bottom:20px}
  .start-grid{gap:14px}
  .home .quote{padding:8px 20px}
  .home .quote .meta{font-size:12px}
  .home .chest .cbox{height:108px}
  .home .chest img{height:108px}
  .home .hero h1{font-size:36px}
  .home .quote p{font-size:22px}
  .home .gen{padding:10px 14px}
  .home .slot strong{font-size:18px}
  .home .gen{padding:12px 16px;gap:8px}
  .home .gen-slots{gap:8px}
  .home .slot{padding:6px 10px}
}
.start-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.start-grid .s2{grid-column:span 2;min-height:200px}
.start-grid .s3{grid-column:span 3}
.start-grid .s6{grid-column:1/-1}
.start-grid .chest{min-height:0;display:flex;justify-content:center;align-items:center;background:none;border:0;padding:0}
.chest .cbox{position:relative;display:inline-block;height:140px}
.chest img{display:block;height:140px;width:auto}
.chest:hover img,.chest:focus-visible img{transform:translateY(-3px)}
.chest img{transition:transform .15s}
.logo img{display:block;height:52px;width:auto}
@media (min-width:900px){
  .foot{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bg);padding:14px 24px;margin:0;justify-content:center}
  main{padding-bottom:110px}
}

/* Karten und Inhalte */
.hero{display:flex;flex-direction:column;gap:10px}
.hero p{margin:0;color:var(--muted);max-width:60ch;font-size:17px}
.eyebrow{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tile,.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.tile:hover,.card:hover{border-color:var(--red)}
.tile p,.card p{margin:0;color:var(--muted);font-size:15px}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.list{display:flex;flex-direction:column;gap:10px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:12px;color:var(--muted);margin-left:6px;vertical-align:middle;white-space:nowrap}
.pill.red{background:var(--red);border-color:var(--red);color:#fff}
.pill.todo{color:var(--no);border-color:var(--no)}
.crumb{font-size:14px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb button{color:var(--red);text-decoration:underline;text-underline-offset:3px}
.pagehead{display:flex;flex-direction:column;gap:6px}
.pagehead p{margin:0;color:var(--muted);max-width:62ch}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.vcols{column-width:260px;column-gap:28px}
.vitem{break-inside:avoid;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chip.small{padding:3px 10px;font-size:13px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.detail{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:18px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fact{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.fact span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fact strong{font-size:15px}
.prose{display:flex;flex-direction:column;gap:10px}
.prose p{margin:0}
.tip{border-left:4px solid var(--red);padding:10px 14px;background:var(--hintbg);border-radius:0 12px 12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:16px}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.linkbtn{color:var(--red);text-decoration:underline;text-underline-offset:3px;font-weight:700}
.gen{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.gen-slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.slot{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.slot span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.slot strong{font-family:Caveat,cursive;font-size:22px}
.taglist{display:flex;flex-wrap:wrap;gap:8px}
.taglist span{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:15px}
form{display:flex;flex-direction:column;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:15px}
.field small{color:var(--muted);font-weight:400}
.field input,.field select,.field textarea{background:var(--field);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:16px;width:100%}
.field textarea{min-height:120px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{margin-top:4px;width:18px;height:18px}
.err{color:var(--no);font-size:14px}
.note{font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:16px;padding:12px 14px}
.notice{background:var(--card);border:1px solid var(--ok);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:6px}
.bank{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.bank dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.bank dt{font-size:13px;color:var(--muted);text-transform:uppercase;padding-top:2px}
.bank dd{margin:0;font-family:ui-monospace,Menlo,monospace;font-size:15px;overflow-wrap:anywhere}
.empty{color:var(--muted);text-align:center;padding:28px;border:1px dashed var(--line);border-radius:22px}
/* Startseite: Zettel-Zitat, Szenen-Würfel, Titel in Caveat */
.ttl{margin:4px 0 0}
.ttl svg{display:block;width:100%;height:auto;overflow:visible}
.ttl text{font-family:Caveat,cursive;font-weight:400;font-size:58px;fill:var(--fg)}
.home .quote{position:relative;text-align:left;display:flex;flex-direction:column;gap:6px;background:#FFFFFF;border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 2px rgba(60,45,30,.06);transform:rotate(-.3deg);margin:0 12px;padding:24px 28px 16px}
.home .quote .tape{position:absolute;top:-9px;width:64px;height:18px;background:rgba(232,214,140,.35);box-shadow:none}
.home .quote .tape.l{left:12%;transform:rotate(-4deg)}
.home .quote .tape.r{right:12%;transform:rotate(3deg)}
.home .quote p{font-family:Caveat,cursive;font-size:34px;line-height:1.15;color:var(--fg)}
.home .quote .meta{font-family:Caveat,cursive;font-size:21px;color:var(--muted)}
.home .copybtn{color:var(--muted)}
.home .gen{background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px rgba(60,45,30,.06);border-radius:22px;padding:20px 22px;gap:14px}
.home .gen .eyebrow{font-size:13px;letter-spacing:.08em}
.home .slot{background:#fff;border:1px solid #e0d9cf;border-radius:12px;padding:10px 14px;min-height:76px}
.home .slot span{font-size:12px}
.home .slot strong{font-family:Caveat,cursive;font-weight:400;font-size:26px;line-height:1.1;display:block;margin-top:8px}
.home .gen-slots{grid-template-columns:repeat(4,minmax(0,1fr))}
.home .chest .cbox,.home .chest img{height:clamp(90px,13vh,140px)}
@media (min-width:900px) and (max-height:800px){
  .home .quote{padding:12px 22px 10px}
  .home .quote p{font-size:24px}
  .home .quote .meta{font-size:17px}
  .home .gen{padding:12px 16px;gap:8px}
  .home .slot{min-height:56px;padding:6px 10px}
  .home .slot strong{font-size:22px;margin-top:2px}
  .home .tile{min-height:70px;padding:10px 14px}
  .home .tile h3{font-size:18px}
}
/* Vorgaben-Einträge als Notizzettel wie das Zitat */
.vcols{column-width:260px;column-gap:24px}
.vitem{break-inside:avoid;margin:0 0 24px;min-height:150px;padding:44px 52px 40px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:url(note-a.png) center/100% 100% no-repeat;border:0;font-family:Caveat,cursive;font-size:26px;line-height:1.15;color:var(--fg);overflow-wrap:anywhere;hyphens:auto}
.vitem:nth-child(even){background-image:url(note-b.png)}
.vgtile{position:relative;min-height:160px;padding:44px 52px 40px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:url(note-a.png) center/100% 100% no-repeat;border:0;border-radius:0;box-shadow:none;font-family:Caveat,cursive;color:var(--fg);overflow-wrap:anywhere;hyphens:auto}
.vgtile:nth-child(even){background-image:url(note-b.png)}
.vgtile h3{font-family:Caveat,cursive;font-size:30px;font-weight:700;line-height:1.1}
.vgtile .meta{font-family:Caveat,cursive;font-size:19px;color:var(--muted);letter-spacing:0}
.vitem .meta{display:block;margin-top:6px;font-family:Caveat,cursive;font-size:19px;color:var(--muted);letter-spacing:0}
.vitem .linkbtn{font-family:Caveat,cursive;font-size:18px}
.home .inner{min-height:calc(100dvh - var(--hh) - 96px);justify-content:space-evenly;gap:12px}
.home .sep{margin:0}
.chests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:center;justify-items:center}
.home .chests .chest .cbox,.home .chests .chest img{height:clamp(90px,13vh,140px)}
.startbtns{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dlg{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.dlg[hidden]{display:none!important}
.dlg-box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.dlg-box h2{margin:0 0 12px}
.dlgform{display:flex;flex-direction:column;gap:12px}
.dlgform label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.dlgform input,.dlgform select,.dlgform textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.dlgform textarea{min-height:140px;resize:vertical}
.dlgform .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dlgfields{display:flex;flex-direction:column;gap:12px}
.dlgfields[hidden]{display:none!important}
.adminbar{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 8px}
button.loginbtn{border:0;cursor:pointer;font:inherit;font-weight:700;font-size:16px}
/* Schriften nach Design: Schreibmaschine für Titel und Bedienelemente, Handschrift für Notizen */
h1,h2,.pagehead h1{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;font-weight:700;letter-spacing:0}
h3{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;font-weight:700}
button,.btn,.chip,select,input,.eyebrow,.meta,.pill,.crumb,.topnav,.loginbtn,.foot button,.empty,.slot span{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}
.foot button,.foot a{font-size:14px}
/* Ganze Seite in Caveat (Handschrift) */
*{font-family:Caveat,cursive;font-size-adjust:.5}
body{font-size:17px;line-height:1.3}
button,input,select,textarea{font-size:inherit}
/* Caveat ist optisch klein: Größe anpassen, Notizen und Titel ausnehmen */
.ttl,.ttl *,.quote,.quote *,.vitem,.vitem *,.vgtile,.vgtile *,.slot strong,.slot strong *{font-size-adjust:none}
</style>
</head>
<body>

<div class="topwrap">
<header class="top">
  <button class="iconbtn menu-btn" id="menuBtn" aria-label="Menü öffnen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <button class="logo" data-go="start" aria-label="Zur Startseite"><img src="logo.png" alt="Impro-Fundus"></button>
  <nav class="topnav" id="topnav" aria-label="Hauptmenü"></nav>
  <div class="rightbox">
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" class="qin" type="search" placeholder="Spiel oder Vorgabe suchen" aria-label="Suchen">
  </label>
  <button class="loginbtn" id="adminBtn" type="button">Anmelden</button>
  </div>
</header>
</div>

<div class="shell">
  <aside class="side" id="side" aria-label="Hauptmenü"></aside>
  <main id="main"></main>
</div>

<aside class="drawer" id="drawer" aria-label="Menü"></aside>
<div class="scrim" id="scrim" hidden></div>
<nav class="bottom" id="bottom" aria-label="Schnellmenü"></nav>
<div class="dlg" id="dlg" hidden><div class="dlg-box" id="dlgBox" role="dialog" aria-modal="true"></div></div>

<script>
const CONFIG = {
  // Adresse deiner Impro-App-Schnittstelle (Google Apps Script)
  API: "https://script.google.com/macros/s/AKfycbwcGZii-rdT7MHU_vxgWMGMFsZIuwUW96_ECA8vTRAzEk8RbPszsdT2Dh8CPYJSWgqM/exec",
  // Adresse, an die Vorschläge gehen
  KONTAKT_MAIL: "leon@impro-brand.de",
  // Spendenkonto. Solange leer, steht dort ein Hinweis.
  SPENDE: { inhaber: "", iban: "", bic: "", zweck: "Spende Impro-Fundus" }
};
const UE_INFO = {
  "Zweierübungen": "Übungen für genau zwei Personen.",
  "Dreierübungen": "Übungen für genau drei Personen.",
  "Gruppenübungen": "Übungen für Gruppen.",
  "Warm-Up-Spiele": "Aufwärmen für den Probenbeginn.",
  "Kennenlernspiele": "Spiele, mit denen sich Gruppen besser kennenlernen."
};

let CATS = [], ITEMS = [], VORG = {}, LOADED = false, FEHLER = "";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const catOf = id => CATS.find(c => c.id === id);
const shortOf = i => {
  if (!i.ab) return "Beschreibung folgt.";
  const z = i.ab.split(/\n/).find(l => l.trim().length > 30) || i.ab.split("\n")[0];
  return z.slice(0, 150);
};
const seite = (titel, text) => `<div class="pagehead"><h1>${esc(titel)}</h1></div><div class="note">${esc(text)}</div>`;
const prose = t =>t.split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join("");
const pickFrom = list => (list && list.length) ? list[Math.floor(Math.random() * list.length)].t : "–";
const DICE = [["Ort", "ort"], ["Beziehung", "bezieh"], ["Gefühl", "gef"], ["Tätigkeit", "tät"]];
const draw = () => {
  const keys = Object.keys(VORG);
  const out = {};
  DICE.forEach(([label, word], i) => {
    const k = keys.find(x => x.toLowerCase().includes(word)) || keys[i];
    out[label] = pickFrom(k ? VORG[k] : []);
  });
  return out;
};
const vCount = () => Object.values(VORG).reduce((a, x) => a + x.length, 0);

function setData(d) {
  CATS = d.uebungenReihe.map(k => ({ id: k, name: k, desc: UE_INFO[k] || "" }));
  ITEMS = d.uebungen.map(u => ({ id: u.id, cat: u.kat, title: u.titel, level: u.level || "", ab: u.ablauf || "", dauer: u.dauer || "", tn: u.tn || "", eig: u.eig || [] }));
  VORG = {};
  d.vorgabenReihe.forEach(k => { if (d.vorgaben[k]) VORG[k] = d.vorgaben[k]; });
  Object.keys(d.vorgaben).forEach(k => { if (!VORG[k]) VORG[k] = d.vorgaben[k]; });
  LOADED = true;
}

const S = { view: "start", cat: null, id: null, vcat: null, vprop: "alle", q: "", sent: false, level: "alle", p: "alle", draw: null };

function go(view, o = {}) {
  Object.assign(S, { view, cat: null, id: null, vcat: view === "vorgaben" ? null : S.vcat }, o);
  if (view !== "einreichen") S.sent = false;
  closeDrawer(); render(); window.scrollTo(0, 0);
}
function closeDrawer() { $("#drawer").classList.remove("open"); $("#scrim").hidden = true; }
function openDrawer() { $("#drawer").classList.add("open"); $("#scrim").hidden = false; }

const ICONS = {
  start: '<path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/>',
  kats: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  vorgaben: '<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.3" fill="currentColor"/><circle cx="15" cy="15" r="1.3" fill="currentColor"/><circle cx="15" cy="9" r="1.3" fill="currentColor"/><circle cx="9" cy="15" r="1.3" fill="currentColor"/>',
  einreichen: '<path d="M12 5v14M5 12h14"/>',
  spenden: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>'
};

function navHTML() {
  const b = (on, attrs, label, extra = "") => `<button class="navbtn${on ? " on" : ""}" ${attrs}><span>${label}</span>${extra}</button>`;
  let h = b(S.view === "start", 'data-go="start"', "Start");
  h += `<div class="lbl">Übungen & Spiele</div>`;
  CATS.forEach(c => {
    const n = ITEMS.filter(i => i.cat === c.id).length;
    h += b(S.view === "kat" && S.cat === c.id, `data-cat="${esc(c.id)}"`, esc(c.name), `<span class="count">${n}</span>`);
  });
  h += `<div class="lbl">Vorgaben</div>`;
  h += b(S.view === "vorgaben", 'data-go="vorgaben"', "Vorgaben-Sammlung", `<span class="count">${vCount()}</span>`);
  h += `<div class="lbl">Mitmachen</div>`;
  h += b(S.view === "einreichen", 'data-go="einreichen"', "Vorschlag einreichen");
  h += b(S.view === "spenden", 'data-go="spenden"', "Spenden");
  h += `<div class="memberbox"><strong>Für die Impro-Gruppe</strong><p>Mitglieder melden sich mit Namen und PIN an.</p><a class="btn red block" href="app/">Mitglieder-Anmeldung</a></div>`;
  return h;
}

function bottomHTML() {
  const t = [["start", "Start"], ["kats", "Spiele"], ["vorgaben", "Vorgaben"], ["einreichen", "Einreichen"], ["spenden", "Spenden"]];
  return t.map(([k, l]) => {
    const on = S.view === k || (k === "kats" && (S.view === "kat" || S.view === "item"));
    return `<button data-go="${k}" class="${on ? "on" : ""}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">${ICONS[k]}</svg>${l}</button>`;
  }).join("");
}

const card = i => `<button class="card" data-item="${esc(i.id)}"><span class="eyebrow">${esc(i.cat)}${i.dauer ? " · " + esc(i.dauer) : ""}</span><h3>${esc(i.title)}${!i.ab ? '<span class="pill todo">folgt</span>' : ""}</h3><p>${esc(shortOf(i))}</p><span class="meta">${i.level ? `<span>${esc(i.level)}</span>` : ""}</span></button>`;
const genHTML = () => `<section class="gen" aria-live="polite"><span class="eyebrow">Szenen-Würfel</span><div class="gen-slots">${Object.entries(S.draw || {}).map(([k, v]) => `<div class="slot"><span>${k}</span><strong>${esc(v)}</strong></div>`).join("")}</div><div><button class="btn red" data-roll>Neu würfeln</button></div></section>`;

const V = {
  start() {
    const z = zitatHeute();
    return `<h1 class="ttl"><svg viewBox="0 0 920 80" role="img" aria-label="Der Fundus für alle, die Impro spielen."><text x="0" y="62" textLength="920" lengthAdjust="spacingAndGlyphs">Der Fundus für alle, die Impro spielen.</text></svg></h1>
    <div class="quote"><span class="tape l"></span><span class="tape r"></span><p>„${esc(z.t)}“</p><div class="qfoot"><span class="meta">— ${esc(z.a)}</span><button class="copybtn" data-quote="1" data-txt="${esc("„" + z.t + "“ – " + z.a)}" aria-label="Zitat kopieren" title="Zitat kopieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button></div></div>
    <hr class="sep">
    <div class="chests">
      <button class="chest" data-go="kats" aria-label="Übungen"><span class="cbox"><img src="kiste-uebungen.png" alt="Übungen"></span></button>
      <button class="chest" data-cat="Kennenlernspiele" aria-label="Kennenlernspiele"><span class="cbox"><img src="kiste-kennenlernen.png" alt="Kennenlernspiele"></span></button>
      <button class="chest" data-go="vorgaben" aria-label="Vorgaben"><span class="cbox"><img src="kiste-vorgaben.png" alt="Vorgaben"></span></button>
    </div>
    ${genHTML()}
    <div class="startbtns">
      <button class="tile" data-go="impro"><h3>Was ist eigentlich Impro?</h3><p>Eine kurze Einführung in das Improvisationstheater.</p></button>
      <button class="tile" data-go="einreichen"><h3>Eigene Idee einreichen</h3><p>Du kennst ein Spiel, das hier fehlt? Schick es uns, dann prüfen wir es.</p></button>
    </div>`;
  },

  kats() {
    return `<div class="pagehead"><h1>Übungen & Spiele</h1><p>Wähle einen Bereich.</p></div>${adminBar(`<button class="btn red" data-admin-new="uebung">+ Neue Übung</button>`)}<div class="grid">${CATS.map(c => `<button class="tile" data-cat="${esc(c.id)}"><span class="meta">${ITEMS.filter(i => i.cat === c.id).length} Einträge</span><h3>${esc(c.name)}</h3><p>${esc(c.desc)}</p></button>`).join("")}</div>`;
  },

  kat() {
    const c = catOf(S.cat);
    const l = ITEMS.filter(i => i.cat === c.id && (S.level === "alle" || i.level === S.level));
    return `<div class="crumb"><button data-go="kats">Übungen & Spiele</button><span>›</span><span>${esc(c.name)}</span></div>
    <div class="pagehead"><h1>${esc(c.name)}</h1><p>${esc(c.desc)}</p></div>
    ${adminBar(`<button class="btn red" data-admin-new="uebung" data-kat="${esc(c.id)}">+ Übung in „${esc(c.name)}“</button>`)}
    <div class="row"><label for="lvl" class="eyebrow">Niveau</label><select id="lvl" class="chip">${["alle", "Einsteiger", "Fortgeschritten"].map(x => `<option value="${x}" ${x === S.level ? "selected" : ""}>${x === "alle" ? "Alle" : x}</option>`).join("")}</select></div>
    <div class="list">${l.length ? l.map(card).join("") : '<div class="empty">Für diese Auswahl gibt es noch nichts.</div>'}</div>`;
  },

  item() {
    const i = ITEMS.find(x => x.id === S.id), c = catOf(i.cat);
    return `<div class="crumb"><button data-go="kats">Übungen & Spiele</button><span>›</span><button data-cat="${esc(c.id)}">${esc(c.name)}</button></div>
    <article class="detail"><div class="pagehead"><span><span class="pill red">${esc(c.name)}</span></span><h1>${esc(i.title)}</h1></div>
    <div class="facts"><div class="fact"><span>Dauer</span><strong>${esc(i.dauer || "–")}</strong></div><div class="fact"><span>Niveau</span><strong>${esc(i.level || "–")}</strong></div></div>
    ${i.eig.length ? `<div class="taglist">${i.eig.map(e => `<span>${esc(e)}</span>`).join("")}</div>` : ""}
    ${i.ab ? `<section class="prose"><h2>So geht's</h2>${prose(i.ab)}</section>` : `<div class="tip"><strong>Hier fehlt noch eine Beschreibung.</strong> Du kennst das Spiel? <button class="linkbtn" data-go="einreichen">Beschreibung einreichen</button></div>`}
    </article>
    ${adminBar(`<button class="btn" data-admin-edit="${esc(i.id)}">Bearbeiten</button>`)}
    <div class="row"><button class="btn" data-cat="${esc(c.id)}">← Zurück zur Liste</button></div>`;
  },

  vorgaben() {
    if (!S.vcat) {
      return `<div class="pagehead"><h1>Vorgaben</h1><p>Wähle einen Bereich.</p></div><div class="grid">${Object.keys(VORG).map(k => `<button class="vgtile" data-v="${esc(k)}"><span class="meta">${VORG[k].length} Vorgaben</span><h3>${esc(k)}</h3></button>`).join("")}</div>`;
    }
    const list = VORG[S.vcat] || [];
    return `<div class="crumb"><button data-go="vorgaben">Vorgaben</button><span>›</span><span>${esc(S.vcat)}</span></div>
    <div class="pagehead"><h1>${esc(S.vcat)}</h1><p>${list.length} Vorgaben</p></div>
    <div class="chips mob" role="group" aria-label="Vorgaben-Bereich">${Object.keys(VORG).map(k => `<button class="chip" aria-pressed="${S.vcat === k}" data-v="${esc(k)}">${esc(k)}</button>`).join("")}</div>
    ${adminBar(`<button class="btn red" data-admin-new="vorgabe" data-kat="${esc(S.vcat)}">+ Vorgabe in „${esc(S.vcat)}“</button>`)}
    <div class="vcols">${list.map(v => `<div class="vitem">${esc(v.t)}${v.h ? `<br><span class="meta">${esc(v.h)}</span>` : ""}${ADMIN && v.id ? `<br><button class="linkbtn" data-admin-vedit="${esc(v.id)}">bearbeiten</button>` : ""}</div>`).join("")}</div>`;
  },

  suche() {
    const q = S.q.toLowerCase();
    const l = ITEMS.filter(i => (i.title + " " + i.ab).toLowerCase().includes(q));
    const vs = Object.entries(VORG).flatMap(([k, a]) => a.filter(v => v.t.toLowerCase().includes(q)).map(v => [k, v.t]));
    return `<div class="pagehead"><h1>Suche: „${esc(S.q)}“</h1><p>${l.length} Übungen · ${vs.length} Vorgaben</p></div>
    <div class="list">${l.length ? l.map(card).join("") : '<div class="empty">Nichts gefunden. Vielleicht magst du es einreichen?</div>'}</div>
    ${vs.length ? `<h2>Vorgaben</h2><div class="taglist">${vs.map(([k, t]) => `<span><span class="meta">${esc(k)}</span> ${esc(t)}</span>`).join("")}</div>` : ""}`;
  },

  wuerfel() {
    return `<div class="pagehead"><h1>Szenenwürfel</h1><p>Würfle eine zufällige Kombination aus Ort, Beziehung, Gefühl und Tätigkeit.</p></div>${genHTML()}`;
  },

  impro() { return seite("Was ist eigentlich Impro?", "Inhalt folgt."); },
  ueber() { return seite("Über den Fundus", "Hier kommt bald ein Text über den Fundus."); },
  gruender() { return seite("Über den Gründer des Impro-Fundus", "Hier kommt bald ein Text über den Gründer."); },
  impressum() { return seite("Impressum", "Inhalt folgt."); },
  datenschutz() { return seite("Datenschutz", "Inhalt folgt."); },
  nutzung() { return seite("Nutzungsbedingungen", "Inhalt folgt."); },

  einreichen() {
    if (S.sent) return `<div class="pagehead"><h1>Danke für deinen Vorschlag!</h1></div><div class="notice"><strong>Dein Mail-Programm wurde geöffnet.</strong><span>Schick die Mail ab, dann wird dein Vorschlag geprüft.</span></div><div class="row"><button class="btn" data-again>Noch etwas einreichen</button></div>`;
    const opts = CATS.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
    const vopts = Object.keys(VORG).map(k => `<option>${esc(k)}</option>`).join("");
    const offen = !CONFIG.KONTAKT_MAIL;
    return `<div class="pagehead"><h1>Vorschlag einreichen</h1></div>
    ${offen ? '<div class="note">Das Einreichen ist gerade noch nicht eingerichtet.</div>' : ""}
    <form id="f" novalidate>
     <div class="field"><label for="f-kind">Was möchtest du einreichen?</label><select id="f-kind"><option>Übung</option><option>Vorgabe</option></select></div>
     <div class="field"><label for="f-title">Name</label><input id="f-title" placeholder="z. B. Gefühls-Staffel"></div>
     <div class="field" id="wrap-cat"><label for="f-cat">Bereich</label><select id="f-cat">${opts}</select></div>
     <div class="field" id="wrap-vcat" hidden><label for="f-vcat">Art der Vorgabe</label><select id="f-vcat">${vopts}</select></div>
     <div class="field"><label for="f-text">Beschreibung und Ablauf</label><textarea id="f-text" placeholder="Wie läuft es ab? Was ist die Regel?"></textarea></div>
     <div class="two" id="wrap-meta"><div class="field"><label for="f-players">Anzahl Personen</label><input id="f-players" placeholder="z. B. 2–4"></div><div class="field"><label for="f-level">Niveau</label><select id="f-level"><option>Einsteiger</option><option>Fortgeschritten</option></select></div></div>
     <div class="two"><div class="field"><label for="f-name">Dein Name <small>(freiwillig)</small></label><input id="f-name"></div><div class="field"><label for="f-mail">E-Mail für Rückfragen <small>(freiwillig)</small></label><input id="f-mail" type="email"></div></div>
     <label class="check"><input type="checkbox" id="f-ok"><span>Ich bin einverstanden, dass mein Vorschlag auf der Website veröffentlicht werden darf.</span></label>
     <p class="err" id="f-err" hidden></p>
     <button class="btn red" type="submit" ${offen ? "disabled" : ""}>Vorschlag absenden</button>
    </form>`;
  },

  spenden() {
    const s = CONFIG.SPENDE;
    const konto = s.iban
      ? `<dl><dt>Inhaber</dt><dd>${esc(s.inhaber)}</dd><dt>IBAN</dt><dd id="iban">${esc(s.iban)}</dd>${s.bic ? `<dt>BIC</dt><dd>${esc(s.bic)}</dd>` : ""}<dt>Zweck</dt><dd>${esc(s.zweck)}</dd></dl><div class="row"><button class="btn" data-copy>IBAN kopieren</button><span class="meta" id="copied" aria-live="polite"></span></div>`
      : `<div class="notice"><strong>Die Spendenfunktion wird später eingebaut.</strong><span>Bis dahin kannst du den Fundus bei Fragen direkt ansprechen.</span></div>` + `<svg viewBox="0 0 320 180" width="100%" role="img" aria-label="Kommt bald" style="max-width:320px;height:auto;display:block;margin:0 auto">
  <rect width="320" height="180" rx="18" fill="#FFFFFF"/>
  <rect x="0" y="0" width="320" height="180" rx="18" fill="none" stroke="#E6DFD4"/>
  <path d="M40 60 h120 a16 16 0 0 1 16 16 v38 a16 16 0 0 1 -16 16 h-74 l-22 18 v-18 h-24 a16 16 0 0 1 -16 -16 v-38 a16 16 0 0 1 16 -16 z" fill="#B02E28"/>
  <circle cx="72" cy="95" r="6" fill="#fff"/><circle cx="100" cy="95" r="6" fill="#fff"/><circle cx="128" cy="95" r="6" fill="#fff"/>
  <path d="M200 96 h80 a14 14 0 0 1 14 14 v28 a14 14 0 0 1 -14 14 h-60 l-14 14 v-14 h-6 a14 14 0 0 1 -14 -14 v-28 a14 14 0 0 1 14 -14 z" fill="#ffffff" stroke="#8E2220" stroke-width="3"/>
  <path d="M258 40 l5 12 13 2 -10 8 3 13 -11 -7 -11 7 3 -13 -10 -8 13 -2 z" fill="#8E2220"/>
  <text x="160" y="172" text-anchor="middle" font-family="Caveat,cursive" font-size="20" fill="#1F1B17">Kommt bald</text>
</svg>`;
    return `<div class="pagehead"><h1>Den Fundus unterstützen</h1><p>Der Impro-Fundus ist kostenlos und werbefrei. Mit einer Spende hilfst du bei Hosting, Pflege und neuen Inhalten.</p></div>
    <section class="bank"><h2>Überweisung</h2>${konto}</section>`;
  }
};

function sideHTML() {
  if (!LOADED) return "";
  const b = (on, attrs, label, extra = "") => `<button class="navbtn${on ? " on" : ""}" ${attrs}><span>${label}</span>${extra}</button>`;
  if (["kats", "kat", "item"].includes(S.view)) {
    const act = S.view === "item" ? ((ITEMS.find(x => x.id === S.id) || {}).cat) : S.cat;
    return `<div class="lbl">Übungen & Spiele</div>` + CATS.map(c => b(act === c.id, `data-cat="${esc(c.id)}"`, esc(c.name), `<span class="count">${ITEMS.filter(i => i.cat === c.id).length}</span>`)).join("");
  }
  if (S.view === "vorgaben") {
    return `<div class="lbl">Vorgaben</div>` + Object.keys(VORG).map(k => b(S.vcat === k, `data-v="${esc(k)}"`, esc(k), `<span class="count">${VORG[k].length}</span>`)).join("");
  }
  return "";
}

function topnavHTML() {
  const act = v => (S.view === v ? "on" : "");
  const ueAct = ["kats", "kat", "item"].includes(S.view) ? "on" : "";
  const ue = CATS.map(c => `<button data-cat="${esc(c.id)}">${esc(c.name)}</button>`).join("");
  const vo = Object.keys(VORG).map(k => `<button data-v="${esc(k)}">${esc(k)}</button>`).join("");
  return `<div class="dd"><button class="${ueAct}" data-go="kats">Übungen ▾</button><div class="ddmenu">${ue}</div></div>`
    + `<div class="dd"><button class="${act("vorgaben")}" data-go="vorgaben">Vorgaben ▾</button><div class="ddmenu">${vo}</div></div>`
    + `<button class="${act("wuerfel")}" data-go="wuerfel">Szenenwürfel</button>`
    + `<button class="${act("einreichen")}" data-go="einreichen">Eigene Idee einreichen</button>`;
}

const ZITATE = [
  { t: "Die ganze Welt ist eine Bühne, und alle Männer und Frauen nur Spieler.", a: "William Shakespeare, Wie es euch gefällt" },
  { t: "Versuch es. Scheitere. Scheitere besser.", a: "Samuel Beckett" },
  { t: "Der Mensch spielt nur, wo er in voller Bedeutung des Worts Mensch ist, und er ist nur da ganz Mensch, wo er spielt.", a: "Friedrich Schiller, Briefe über die ästhetische Erziehung" }
];
const zitatHeute = () => {
  const d = new Date();
  const tag = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
  return ZITATE[tag % ZITATE.length];
};

const footHTML = () => `<footer class="foot"><button data-go="ueber">Über den Fundus</button><button data-go="gruender">Über den Gründer</button><button data-go="spenden">Fundus unterstützen</button><button data-go="impressum">Impressum</button><button data-go="datenschutz">Datenschutz</button><button data-go="nutzung">Nutzungsbedingungen</button></footer>`;

function render() {
  const sh = sideHTML();
  const ab = $("#adminBtn"); if (ab) ab.textContent = ADMIN ? "Abmelden" : "Anmelden";
  $("#side").innerHTML = sh;
  $("#side").hidden = !sh;
  $("#topnav").innerHTML = topnavHTML();
  $("#drawer").innerHTML = navHTML();
  $("#bottom").innerHTML = bottomHTML();
  if (!LOADED) {
    $("#main").innerHTML = `<div class="inner">${FEHLER ? `<div class="empty">${esc(FEHLER)}</div>` : '<div class="empty">Lade Übungen und Vorgaben …</div>'}</div>`;
    return;
  }
  const fn = V[S.view] || V.start;
  $("#main").classList.toggle("home", S.view === "start");
  $("#main").innerHTML = `<div class="inner">${fn()}${footHTML()}</div>`;
  if (S.view === "einreichen" && !S.sent) bindForm();
}

function bindForm() {
  const k = $("#f-kind");
  const sync = () => { const v = k.value === "Vorgabe"; $("#wrap-cat").hidden = v; $("#wrap-meta").hidden = v; $("#wrap-vcat").hidden = !v; };
  k.onchange = sync; sync();
  const f = $("#f");
  if (!f) return;
  f.onsubmit = e => {
    e.preventDefault();
    const t = $("#f-title").value.trim(), x = $("#f-text").value.trim(), err = $("#f-err");
    const show = m => { err.textContent = m; err.hidden = false; };
    if (!t || !x) return show("Bitte gib einen Namen und eine Beschreibung ein.");
    if (!$("#f-ok").checked) return show("Bitte bestätige, dass der Vorschlag veröffentlicht werden darf.");
    const body = [
      "Art: " + k.value,
      "Name: " + t,
      k.value === "Vorgabe" ? "Vorgaben-Art: " + $("#f-vcat").value : "Bereich: " + catOf($("#f-cat").value).name,
      "Personen: " + $("#f-players").value.trim(),
      "Niveau: " + $("#f-level").value,
      "",
      x,
      "",
      "Von: " + ($("#f-name").value.trim() || "Anonym") + " " + $("#f-mail").value.trim()
    ].join("\n");
    S.sent = true;
    window.location.href = `mailto:${CONFIG.KONTAKT_MAIL}?subject=${encodeURIComponent("Vorschlag Impro-Fundus: " + t)}&body=${encodeURIComponent(body)}`;
    render();
  };
}

document.addEventListener("click", e => {
  if (e.target.closest("#menuBtn")) { openDrawer(); return; }
  if (e.target.closest("#adminBtn")) { if (ADMIN) adminEnde(); else adminLogin(); return; }
  if (e.target.id === "dlg") { closeDlg(); return; }
  const t = e.target.closest("button");
  if (!t) return;
  const d = t.dataset;
  if (d.dlgClose !== undefined) { closeDlg(); return; }
  if (d.adminNew !== undefined) { editor(null, d.adminNew, d.kat || ""); return; }
  if (d.adminEdit !== undefined) { const i = findeItem(d.adminEdit); if (i) editor(i, "uebung"); return; }
  if (d.adminVedit !== undefined) { const f = findeVorgabe(d.adminVedit); if (f) editor({ ...f.v, kat: f.k, title: f.v.t, ab: f.v.h }, "vorgabe"); return; }
  if (d.go) { go(d.go); return; }
  if (d.cat !== undefined) { go("kat", { cat: d.cat }); return; }
  if (d.item) { go("item", { id: d.item }); return; }
  if (d.v) { go("vorgaben", { vcat: d.v, vprop: "alle" }); return; }
  if (d.vp) { S.vprop = d.vp; render(); return; }
  if (d.roll !== undefined) { S.draw = draw(); render(); return; }
  if (d.again !== undefined) { S.sent = false; render(); return; }
  if (d.quote !== undefined) {
    const ok = () => { t.title = "Kopiert"; t.classList.add("done"); setTimeout(() => { t.title = "Zitat kopieren"; t.classList.remove("done"); }, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(t.dataset.txt).then(ok, () => { t.title = "Bitte markieren und kopieren"; });
    return;
  }
  if (d.copy !== undefined) {
    const txt = $("#iban").textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => $("#copied").textContent = "Kopiert", () => $("#copied").textContent = "Bitte markieren und kopieren");
    return;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "lvl") { S.level = e.target.value; render(); }
  if (e.target.id === "pp") { S.p = e.target.value; render(); }
});
$("#scrim").onclick = closeDrawer;
document.addEventListener("input", e => {
  if (!e.target.classList.contains("qin")) return;
  S.q = e.target.value.trim();
  if (S.q && S.view !== "start") go("suche");
  else if (!S.q && S.view === "suche") go("start");
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !e.target.classList.contains("qin")) return;
  S.q = e.target.value.trim();
  if (S.q) go("suche");
});

render();
function laden() {
  return fetch(CONFIG.API + "?action=fundus")
    .then(r => { if (!r.ok) throw new Error("http"); return r.json(); })
    .then(d => {
      if (!d.ok) throw new Error("data");
      setData(d);
      if (!S.vcat || !VORG[S.vcat]) S.vcat = Object.keys(VORG)[0] || null;
      if (!S.draw) S.draw = draw();
      FEHLER = "";
      render();
    })
    .catch(() => {
      FEHLER = FEHLER || "Die Liste kann gerade nicht geladen werden. Bitte später noch einmal versuchen.";
      render();
    });
}
laden();

/* ----- Admin: Anmeldung und Bearbeiten (nur Fundus-Website) ----- */
var ADMIN = null;
try { ADMIN = sessionStorage.getItem("fundus-admin"); } catch (e) {}
const adminBar = html => ADMIN ? `<div class="adminbar">${html}</div>` : "";
async function apiPost(obj) {
  const r = await fetch(CONFIG.API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(obj) });
  return r.json();
}
function adminEnde() {
  ADMIN = null;
  try { sessionStorage.removeItem("fundus-admin"); } catch (e) {}
  closeDlg(); render();
}
function openDlg(html) {
  $("#dlgBox").innerHTML = html;
  $("#dlg").hidden = false;
}
function closeDlg() { $("#dlg").hidden = true; $("#dlgBox").innerHTML = ""; }
function adminLogin() {
  openDlg(`<h2>Admin-Anmeldung</h2>
    <form id="adminForm" class="dlgform">
      <label>Benutzername<input id="an" autocomplete="username" autocapitalize="none"></label>
      <label>Passwort<input id="ap" type="password" autocomplete="current-password"></label>
      <p class="meta" id="am"></p>
      <div class="row"><button class="btn red" type="submit">Anmelden</button><button class="btn" type="button" data-dlg-close>Abbrechen</button></div>
    </form>`);
  $("#an").focus();
  $("#adminForm").onsubmit = async e => {
    e.preventDefault();
    $("#am").textContent = "Einen Moment …";
    try {
      const r = await apiPost({ action: "adminAnmelden", name: $("#an").value.trim(), passwort: $("#ap").value });
      if (!r.ok) { $("#am").textContent = r.msg || "Anmeldung nicht möglich."; return; }
      ADMIN = r.token;
      try { sessionStorage.setItem("fundus-admin", ADMIN); } catch (x) {}
      closeDlg(); render();
    } catch (x) { $("#am").textContent = "Keine Verbindung. Bitte später noch einmal versuchen."; }
  };
}
function editor(item, art, kat) {
  const vorgabe = art === "vorgabe";
  const katListe = vorgabe ? Object.keys(VORG) : CATS.map(c => c.id);
  const aktuell = item ? item.kat || item.cat || "" : (kat || "");
  const eig = item && item.eig ? item.eig.join(", ") : "";
  const txt = item ? (item.ab || item.h || "") : "";
  openDlg(`<h2>${item ? "Bearbeiten" : "Neu anlegen"}: ${vorgabe ? "Vorgabe" : "Übung"}</h2>
    <form id="edForm" class="dlgform">
      <label>Art
        <select id="edArt">
          <option value="uebung" ${!vorgabe ? "selected" : ""}>Übung / Spiel</option>
          <option value="vorgabe" ${vorgabe ? "selected" : ""}>Vorgabe</option>
        </select></label>
      <label>Titel<input id="edTitel" required value="${esc(item ? item.title || item.t : "")}"></label>
      <label>Kategorie
        <select id="edKat">${katListe.map(k => `<option value="${esc(k)}" ${k === aktuell ? "selected" : ""}>${esc(k)}</option>`).join("")}</select></label>
      <label>Oder neue Kategorie (optional)<input id="edNeueKat" placeholder="z. B. Neue Kategorie"></label>
      <div id="edUebung" ${vorgabe ? "hidden" : ""} class="dlgfields">
        <label>Personen<input id="edTn" value="${esc(item ? item.tn || "" : "")}" placeholder="z. B. 2 oder 2–4"></label>
        <label>Dauer<input id="edDauer" value="${esc(item ? item.dauer || "" : "")}" placeholder="z. B. 10 Min."></label>
        <label>Niveau<select id="edLevel">${["", "Einsteiger", "Fortgeschritten"].map(x => `<option value="${x}" ${x === (item ? item.level || "" : "") ? "selected" : ""}>${x || "–"}</option>`).join("")}</select></label>
        <label>Eigenschaften (mit Komma getrennt)<input id="edEig" value="${esc(eig)}"></label>
      </div>
      <label><span id="edTxtLbl">${vorgabe ? "Hinweis (optional)" : "Ablauf / Beschreibung"}</span><textarea id="edTxt">${esc(txt)}</textarea></label>
      <p class="meta" id="edMsg"></p>
      <div class="row">
        <button class="btn red" type="submit">Speichern</button>
        <button class="btn" type="button" data-dlg-close>Abbrechen</button>
        ${item ? `<button class="btn" type="button" id="edDel" style="margin-left:auto">Löschen</button>` : ""}
      </div>
    </form>`);
  $("#edArt").onchange = () => { const v = $("#edArt").value === "vorgabe"; $("#edUebung").hidden = v; $("#edTxtLbl").textContent = v ? "Hinweis (optional)" : "Ablauf / Beschreibung"; };
  $("#edForm").onsubmit = async e => {
    e.preventDefault();
    const neu = $("#edNeueKat").value.trim();
    const eintrag = {
      art: $("#edArt").value,
      titel: $("#edTitel").value.trim(),
      kat: neu || $("#edKat").value,
      tn: $("#edTn") ? $("#edTn").value.trim() : "",
      dauer: $("#edDauer") ? $("#edDauer").value.trim() : "",
      level: $("#edLevel") ? $("#edLevel").value : "",
      eig: $("#edEig") ? $("#edEig").value.split(",").map(x => x.trim()).filter(Boolean).join(",") : "",
      ablauf: $("#edTxt").value.trim()
    };
    if (item) eintrag.id = item.id;
    await adminSende({ action: "adminSpeichern", eintrag });
  };
  if (item) $("#edDel").onclick = async () => {
    if (!window.confirm("Wirklich löschen? Das kann nicht rückgängig gemacht werden.")) return;
    await adminSende({ action: "adminLoeschen", sid: item.id });
  };
}
async function adminSende(obj) {
  $("#edMsg").textContent = "Einen Moment …";
  try {
    const r = await apiPost(Object.assign({ token: ADMIN }, obj));
    if (!r.ok) {
      $("#edMsg").textContent = r.msg || "Das hat nicht geklappt.";
      if (/erneut/.test(r.msg || "")) adminEnde();
      return;
    }
    closeDlg();
    if (obj.action === "adminLoeschen" && S.view === "item") { S.view = "kats"; S.id = null; S.cat = null; }
    await laden();
  } catch (x) { $("#edMsg").textContent = "Keine Verbindung. Bitte später noch einmal versuchen."; }
}
const findeItem = id => ITEMS.find(x => x.id === id);
const findeVorgabe = id => {
  for (const [k, a] of Object.entries(VORG)) { const v = a.find(x => x.id === id); if (v) return { v, k }; }
  return null;
};
</script>
</body>
</html>
