<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Impro">
<meta name="theme-color" content="#d81b23">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Improtheater des Theater Brand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--red:#d81b23;--maroon:#8e2639;--bg:#ffffff;--card:#f4f4f2;--field:#f4f4f2;--line:#e3e2df;--fg:#161616;--muted:#6f6e6b;--ok:#2e9e5b;--no:#8e2639;--tileA:#e2dfdb;--tileB:#c9c1b9;--hintbg:#fff7e0;--hintline:#f0d890;--overlay:rgba(0,0,0,.45);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0c;--card:#1b1b1c;--field:#232325;--line:#2d2d30;--fg:#f2f2f2;--muted:#9b9a97;--ok:#2e9e5b;--no:#a8324a;--tileA:#3b3734;--tileB:#28241f;--hintbg:#3a3320;--hintline:#6b5a22;--overlay:rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;font-size:16px;background:var(--bg);color:var(--fg);-webkit-tap-highlight-color:transparent}
body.hell{background:#fff;color:#161616}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,select,textarea{font:inherit;color:var(--fg)}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:130px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));display:grid;grid-template-columns:48px 1fr 48px;align-items:center;min-height:58px}
header h1{margin:0;font-size:19px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.home{grid-template-columns:1fr;padding:6px 16px}
header.home h1{text-align:center;font-size:21px}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--fg)}
.ib svg{width:24px;height:24px}
.wrap{padding:16px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;min-height:56px}
.row .grow{flex:1;min-width:0}
.row .t{font-size:17px}
.row .s{font-size:14px;color:var(--muted);margin-top:2px}
.row svg.ic{width:24px;height:24px;color:var(--muted);flex:none}
.chev{color:var(--muted);font-size:20px}
.btn{width:100%;min-height:52px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--fg)}
.btn svg{width:20px;height:20px}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.no{background:var(--no);border-color:var(--no);color:#fff}
.btn.sm{min-height:42px;font-size:15px;font-weight:500;width:auto;padding:0 14px}
.field{width:100%;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px}
textarea.field{min-height:110px;resize:vertical;line-height:1.4}
.label{color:var(--muted);font-size:14px;margin:6px 0 -4px}
.muted{color:var(--muted);font-size:14px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--muted);margin-left:8px;white-space:nowrap;vertical-align:middle}
.pill.ok{background:var(--ok);border-color:var(--ok);color:#fff;margin-left:0}
.pill.no{background:var(--no);border-color:var(--no);color:#fff;margin-left:0}
.pill.plain{margin-left:0}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(var(--tileA),var(--tileB));background-size:cover;background-position:center;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.iconrow{display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap}
.iconrow > *{width:64px;height:64px;border-radius:18px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:26px;text-decoration:none;color:var(--fg);padding:0}
.linkbar{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));z-index:4;display:flex;justify-content:center;gap:72px}
.linkbar a{width:56px;height:52px;display:grid;place-items:center;text-decoration:none}
.linkbar svg{width:40px;height:40px}
body.nos,body.nos #app{overflow:hidden;height:100dvh}
.hometile{height:clamp(110px,calc(100dvh - 560px),176px);aspect-ratio:auto}
.tile.mitbild,.bigtile.mitbild{background-size:cover;background-position:center;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.8)}
.dot{position:absolute;top:4px;right:10px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
nav.bar button{position:relative}
.linkbar img{width:40px;height:40px;object-fit:contain}
.bigtile{border:1px solid var(--line);border-radius:22px;background:linear-gradient(var(--tileA),var(--tileB));min-height:92px;width:100%;display:grid;place-items:center;font-weight:700;font-size:19px;text-align:center;color:var(--fg)}
.tile{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:linear-gradient(var(--tileA),var(--tileB));aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:18px 8px 16px;color:var(--fg);width:100%}
.tile svg{width:64px;height:64px;opacity:.55;margin-top:10px}
.tile .n{font-weight:700;font-size:19px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:10px 4px 12px;color:var(--muted);font-size:16px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);font-weight:600;border-color:var(--red)}
.wraptabs{display:flex;flex-wrap:wrap;gap:6px 16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.wraptabs button{color:var(--muted);font-size:16px;padding:6px 0;border-bottom:2px solid transparent}
.wraptabs button.on{color:var(--fg);font-weight:600;border-color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:15px;white-space:nowrap}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.hero{height:150px;border-radius:20px;background:linear-gradient(var(--tileA),var(--tileB));display:flex;align-items:flex-end;justify-content:center;padding:16px;font-weight:700;font-size:20px;text-align:center}
.stats{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center}
.stat .k{font-size:13px;color:var(--muted)} .stat .v{font-size:18px;font-weight:700;margin-top:4px;overflow-wrap:anywhere}
.prose{white-space:pre-wrap;line-height:1.45;font-size:17px;margin:0}
.cta{position:fixed;left:0;right:0;bottom:calc(80px + env(safe-area-inset-bottom));z-index:5;padding:0 16px;max-width:520px;margin:0 auto}
.cta .btn{box-shadow:0 4px 14px rgba(0,0,0,.25)}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);z-index:6;padding-bottom:max(8px,env(safe-area-inset-bottom))}
nav.bar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;height:72px}
nav.bar button{justify-self:center;min-width:64px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11px}
nav.bar button.on{color:var(--red);font-weight:600}
nav.bar svg{width:28px;height:28px}
nav.bar .home{width:64px;height:64px;min-width:0;border-radius:50%;background:var(--red);color:#fff}
.sheetbg{position:fixed;inset:0;background:var(--overlay);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
.sheet h2{margin:0;font-size:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:30;max-width:90%;text-align:center}
.empty{color:var(--muted);margin:4px 0}
.hint{background:var(--hintbg);border:1px solid var(--hintline);border-radius:14px;padding:10px 12px;font-size:14px}
.spin{text-align:center;color:var(--muted);padding:30px 0}
.dots{display:flex;justify-content:center;gap:14px;margin:8px 0}

.login{max-width:520px;margin:0 auto;padding:max(40px,env(safe-area-inset-top)) 22px 40px;font-family:'Gaegu','Bradley Hand','Segoe Print',cursive}
.login .head{text-align:center;margin:28px 0 56px}
.login .head img{width:100%;max-width:340px;height:auto}
.lrow{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.lrow .lf{position:relative;flex:1}
.lin{width:100%;height:56px;border:2px solid #b9c3bf;border-radius:14px;background:#fff;padding:0 16px;font-family:inherit;font-size:22px;color:var(--fg);outline:none}
.lin::placeholder{color:#222;opacity:1}
.lin:focus{border-color:var(--red)}
.lplus{position:absolute;right:8px;top:9px;width:38px;height:38px;border-radius:12px;border:0;background:none;font-size:28px;line-height:1;color:var(--muted)}
.lgo{width:56px;height:56px;border:2px solid #b9c3bf;border-radius:14px;background:#fff;display:grid;place-items:center;flex:none;padding:0}
.lgo img{width:38px;height:auto}
</style>
</head>
<body>
<div id="app"><p class="spin">Lade …</p></div>
<div id="layer"></div>

<script>
/* ===== KONFIGURATION ===== */
const CONFIG = {
  WHATSAPP_GRUPPE: 'https://chat.whatsapp.com/DfJY6lAIupF4foBF0fvN4v',
  THEATER_MAPS:    'https://www.google.com/maps/search/?api=1&query=Theater+Brand+Freunder+Heideweg+3+52078+Aachen',
  LEITER_MAIL:     'eckervogt@outlook.de'
};

/* ===== Verbindung zum Server ===== */
let SESSION = null;
try { SESSION = JSON.parse(sessionStorage.getItem('impro-session') || 'null'); } catch(e){}
let D = null;          // Daten vom Server
let NAMEN = [];        // Namensliste für die Anmeldung
const API = 'https://script.google.com/macros/s/AKfycbwcGZii-rdT7MHU_vxgWMGMFsZIuwUW96_ECA8vTRAzEk8RbPszsdT2Dh8CPYJSWgqM/exec';
async function api(action, body={}){
  const s = SESSION || {};
  try {
    const t0 = Date.now();
    const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action, id:s.id, pin:s.pin, ...body})});
    const out = await r.json();
    window._lat = {gesamt:Date.now()-t0, server:out && out.ms};
    if(out && out.ok === false && out.msg) out.msg += ' [' + action + ']';
    if(out && out.ok && out.data){ D = out.data; window._frisch = Date.now(); }
    return out;
  } catch(e){ return {ok:false, msg:'Keine Verbindung zum Server (' + e.message + ').'}; }
}
async function laden(){
  if(D && Date.now() - (window._frisch||0) < 3000) return;
  const r = await api('daten');
  if(r.ok){ D = r; }
  else { toast(r.msg || 'Anmeldung abgelaufen.'); abmelden(false); }
}
function setSession(s){ SESSION = s; try{ sessionStorage.setItem('impro-session', JSON.stringify(s)); }catch(e){} }

/* ===== Hilfen ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MO = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const heuteIso = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function dLang(iso){ const d=new Date(iso+'T12:00'); return 'Mittwoch, '+d.getDate()+'. '+MO[d.getMonth()]+' '+d.getFullYear(); }
function dKurz(iso){ const [y,m,d]=iso.split('-'); return d+'.'+m+'.'+y; }
function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2400); }
function anzeige(m){ return m.vorname + (m.nachname ? ' '+m.nachname : ''); }
function mit(id){ return D.mitglieder.find(m => m.id === id); }
function ich(){ return D && mit(SESSION.id); }
function leiter(){ return D && D.leiter; }
function aktuelleProbe(){
  const h = heuteIso();
  const k = D.proben.filter(p => p.datum >= h).sort((a,b) => a.datum < b.datum ? -1 : 1);
  return k[0] || D.proben[0];
}
function meinStatus(probeId){ return D.status.find(s => s.probeId === probeId && s.mitgliedId === SESSION.id); }
function meinWunsch(probeId, spielId){ return D.wuensche.find(w => w.probeId === probeId && w.mitgliedId === SESSION.id && w.spielId === spielId); }

/* ===== Symbole ===== */
const IC = {
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 home:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-4.5v-6h-3v6H6v-9H3z"/></svg>',
 people:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="8" r="3"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6zM15 14.2c3.7-.4 6.5 1.8 6.5 5.8h-4"/></svg>',
 person:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="10" r="3.5" fill="currentColor"/><path d="M5.5 18.5c1.5-2.5 3.8-3.5 6.5-3.5s5 1 6.5 3.5" fill="currentColor"/></svg>',
 group3:'<svg viewBox="0 0 32 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="8" r="3"/><circle cx="16" cy="7" r="3"/><circle cx="25" cy="8" r="3"/><path d="M1.5 20c0-3 2.4-5 5.5-5s5.5 2 5.5 5zM10.5 20c0-3.5 2.4-6 5.5-6s5.5 2.5 5.5 6zM19.5 20c0-3 2.4-5 5.5-5s5.5 2 5.5 5z"/></svg>',
 dice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="4"/><g fill="currentColor" stroke="none"><circle cx="8.5" cy="8.5" r="1.4"/><circle cx="15.5" cy="8.5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="8.5" cy="15.5" r="1.4"/><circle cx="15.5" cy="15.5" r="1.4"/></g></svg>',
 cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>',
 pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>',
 pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.6"/></svg>',
 chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-9l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M8 10h8M8 13h5" stroke-linecap="round"/></svg>',
 help:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17v.5" stroke-linecap="round"/></svg>',
 gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
 key:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v3M21 12v2"/></svg>',
 out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/></svg>',
 camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8a2 2 0 0 1 2-2h2.5L9 4h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.8"/></svg>'
};

/* ===== Router ===== */
let stack = [];
let UI = {ueKat:'2er', voKat:'Ticks', voEig:''};
function go(s, p={}){ stack.push({s, ...p}); render(); window.scrollTo(0,0); }
function back(){ if(stack.length > 1) stack.pop(); render(); window.scrollTo(0,0); }
function swap(s){ stack[stack.length-1] = {s}; render(); window.scrollTo(0,0); }
function tab(s){ stack = [{s}]; render(); window.scrollTo(0,0); }
function cur(){ return stack[stack.length-1] || {s: SESSION ? 'home' : 'login'}; }
function avatar(m, size=52){
  const st = `width:${size}px;height:${size}px;font-size:${Math.round(size*0.36)}px;` + (m && m.bild ? `background-image:url('${m.bild}')` : '');
  return `<div class="avatar" style="${st}">${m && m.bild ? '' : esc((m ? m.vorname : '?').slice(0,1))}</div>`;
}

function render(){
  const c = cur();
  if(!SESSION && c.s!=='login' && c.s!=='hilfe'){ stack=[]; return render(); }
  if(!D && SESSION) return;
  document.body.classList.toggle('hell', c.s === 'login');
  document.body.classList.toggle('nos', c.s === 'home');
  const fn = SCREENS[c.s] || SCREENS.home;
  const r = fn(c);
  const istHome = c.s === 'home';
  const kopf = r.noHeader ? '' : (istHome
    ? `<header class="home"><h1>${esc(r.title)}</h1></header>`
    : `<header><button class="ib" onclick="back()" aria-label="Zurück">${IC.back}</button><h1>${esc(r.title)}</h1><div>${r.right||''}</div></header>`);
  const nav = SESSION && D ? `<nav class="bar"><div class="in">
      <button class="${c.s==='teilnehmer'?'on':''}" onclick="tab('teilnehmer')" aria-label="Teilnehmerliste">${IC.people}Teilnehmer</button>
      <button class="home" onclick="tab('home')" aria-label="Start">${IC.home}</button>
      ${c.s==='uebungen' ? `<button onclick="swap('vorgaben')" aria-label="Zu den Vorgaben">${IC.dice}Vorgaben</button>`
        : c.s==='vorgaben' ? `<button onclick="swap('uebungen')" aria-label="Zu den Übungen">${IC.group3}Übungen</button>`
        : `<button class="${c.s==='profil'?'on':''}" onclick="tab('profil')" aria-label="Mein Profil">${IC.person}Profil${leiter()&&D.vorschlaege.length?`<span class="dot">${D.vorschlaege.length}</span>`:''}</button>`}
    </div></nav>` : '';
  const cta = r.cta ? `<div class="cta">${r.cta}</div>` : '';
  $('#app').innerHTML = kopf + `<main>${r.body}</main>` + cta + nav;
  if(c.s === 'login') setTimeout(() => { const n = $('#loginName'), pn = $('#loginPin'); if(n && n.value && pn) pn.focus(); }, 60);
}

/* ===== Sheets & PIN ===== */
function sheet(html){ $('#layer').innerHTML = `<div class="sheetbg" onclick="if(event.target===this)closeSheet()"><div class="sheet">${html}</div></div>`; }
function closeSheet(){ $('#layer').innerHTML=''; }
let PIN_CB = null;
function pinPad(titel, unter, cb){
  PIN_CB = cb;
  sheet(`<h2>${esc(titel)}</h2><p class="muted" style="margin:0">${esc(unter)}</p>

    <button class="btn" onclick="closeSheet()">Abbrechen</button>`);
  setTimeout(()=>{ const i=$('#pinIn'); if(i) i.focus(); }, 80);
}
function pinEingabe(el){
  el.value = el.value.replace(/\D/g,'').slice(0,4);
  if(el.value.length===4 && PIN_CB){ const v=el.value, cb=PIN_CB; PIN_CB=null; setTimeout(()=>cb(v),80); }
}

}
async function neuAntrag(){
  const n = ($('#neuName').value||'').trim(); if(!n) return toast('Bitte einen Namen eingeben');
  const r = await api('anfrage', {vorname:n}); closeSheet(); toast(r.ok ? 'Anfrage gesendet.' : r.msg);
}
let LOGIN_LAEUFT = false;
async function loginPin(){
  if(LOGIN_LAEUFT) return;
  LOGIN_LAEUFT = true;
  try { await loginPinJetzt(); } finally { LOGIN_LAEUFT = false; }
}
async function loginPinJetzt(){
  const name = ($('#loginName').value||'').trim();
  if(!name) return toast('Bitte deinen Vornamen eingeben');
  const pin = ($('#loginPin').value||'').trim();
  $('#loginMsg').innerHTML = '<div class="hint">Einen Moment, ich melde dich an …</div>';
  const r0 = await api('anmelden', {vorname:name, pin});
  if(!r0.ok){ $('#loginMsg').innerHTML = `<div class="hint">${esc(r0.msg)}</div>`; const pf = $('#loginPin'); if(pf) pf.value = ''; return; }
  $('#loginMsg').innerHTML = '';
  nameMerken(name);
  if(r0.neu){ return pinFestlegen(r0.id); }
  setSession({id:r0.id, pin}); stack=[];
  if(!D) await laden();
  render();
}
function pinFestlegen(id){
  pinPad('PIN festlegen', 'Lege eine vierstellige PIN fest. Die brauchst du ab jetzt zum Anmelden.', async pin => {
    closeSheet();
    toast('Einen Moment …');
    const r = await api('pinSetzen', {id, pin, action:'pinSetzen'});
    if(!r.ok) return toast(r.msg);
    setSession({id, pin}); stack=[]; await laden(); render(); toast('PIN gespeichert');
  });
}

SCREENS.home = () => {
  const E = D.einstellungen || {};
  const p = aktuelleProbe();
  const st = meinStatus(p.id);
  const komme = !!st && st.status !== 'nicht';
  const nicht = !!st && st.status === 'nicht';
  const txt = komme ? 'Du kommst' : nicht ? 'Du kommst nicht' : 'Du hast noch nicht abgestimmt';
  const knoepfe = p.ausgefallen ? '' : `<div class="grid2">
      <button class="btn ${komme?'ok':''}" onclick="event.stopPropagation();setzeStatus('${p.id}','komme')">Ich komme</button>
      <button class="btn ${nicht?'no':''}" onclick="event.stopPropagation();setzeStatus('${p.id}','nicht')">Ich komme nicht</button></div>`;
  return {
    title: 'Improtheater des Theater Brand',
    body: `<div class="wrap">
      <div class="card" style="cursor:pointer" onclick="go('probe',{id:'${p.id}'})"><div class="muted">Nächste Probe</div>
        <div style="font-weight:700;font-size:20px">${dLang(p.datum)}</div>
        <div class="muted">${p.start} – ${p.ende} Uhr</div>
        ${p.ausgefallen?`<div class="hint" style="margin-top:10px"><b>Ausgefallen.</b> ${esc(p.grund)}</div>`:`<div style="margin:10px 0 12px"><span class="pill plain ${komme?'ok':nicht?'no':''}">${txt}</span></div>${knoepfe}`}</div>
      <div class="grid2">
        <button class="tile hometile ${E.kachelUebungen?'mitbild':''}" ${E.kachelUebungen?`style="background-image:url('${E.kachelUebungen}')"`:''} onclick="go('uebungen')">${E.kachelUebungen?'<span></span>':IC.group3}<span class="n">Übungen</span></button>
        <button class="tile hometile ${E.kachelVorgaben?'mitbild':''}" ${E.kachelVorgaben?`style="background-image:url('${E.kachelVorgaben}')"`:''} onclick="go('vorgaben')">${E.kachelVorgaben?'<span></span>':IC.dice}<span class="n">Vorgaben</span></button></div>
      <button class="bigtile ${E.kachelProben?'mitbild':''}" ${E.kachelProben?`style="background-image:url('${E.kachelProben}')"`:''} onclick="go('probenListe')">Bisherige Proben</button>
    </div>
    <div class="linkbar">
      <a href="${CONFIG.THEATER_MAPS}" target="_blank" rel="noopener" aria-label="Route zum Theater" style="color:#d93025">${E.iconMaps?`<img src="${E.iconMaps}" alt="">`:IC.pin}</a>
      <a href="${CONFIG.WHATSAPP_GRUPPE}" target="_blank" rel="noopener" aria-label="WhatsApp-Gruppe" style="color:#25a244">${E.iconWhatsapp?`<img src="${E.iconWhatsapp}" alt="">`:IC.chat}</a></div>`
  };
};
async function setzeStatus(probeId, status){
  const alt = D.status;
  D.status = D.status.filter(s => !(s.probeId===probeId && s.mitgliedId===SESSION.id)).concat([{probeId, mitgliedId:SESSION.id, status, zeit:''}]);
  render();
  const r = await api('status', {probeId, status});
  if(!r.ok){ D.status = alt; render(); return toast(r.msg || 'Konnte nicht gespeichert werden'); }
  render(); toast('Gespeichert');
}

SCREENS.probenListe = () => {
  const alte = D.proben.filter(p => p.datum < heuteIso());
  return {title:'Bisherige Proben', body:`<div class="wrap">${alte.length ? alte.map(p=>`
    <button class="row" onclick="go('probe',{id:'${p.id}'})"><div class="grow"><div class="t">${dKurz(p.datum)}</div>
      <div class="s">${p.ausgefallen ? '<span class="pill no">Ausgefallen</span>' : (p.anwesend.length+' Anwesende · '+p.plan.length+' Übungen')}</div></div><span class="chev">›</span></button>`).join('') : '<p class="empty">Noch keine vergangenen Proben.</p>'}</div>`};
};
SCREENS.probe = c => {
  const p = D.proben.find(x => x.id === c.id);
  const kommend = p.datum >= heuteIso();
  const anw = p.anwesend.map(mit).filter(Boolean);
  const absagen = leiter() ? D.status.filter(s => s.probeId === p.id && s.status === 'nicht').map(s => mit(s.mitgliedId)).filter(Boolean) : [];
  const plan = p.plan.map(id => D.spiele.find(s => s.id === id)).filter(Boolean);
  const person = m => `<div class="row" style="min-height:48px;padding:10px 14px">${avatar(m,36)}<div class="grow">${esc(anzeige(m))}</div></div>`;
  return {
    title: dKurz(p.datum),
    right: leiter() ? `<button class="ib" onclick="go('probeEdit',{id:'${p.id}'})" aria-label="Probe bearbeiten">${IC.pencil}</button>` : '',
    body: `<div class="wrap">
      <div class="card"><b>${dLang(p.datum)}</b><div class="muted">${p.start} – ${p.ende} Uhr</div>
        ${p.ausgefallen?`<div class="hint" style="margin-top:8px"><b>Ausgefallen.</b> ${esc(p.grund)}</div>`:''}</div>
      <p class="label">${kommend?'Zugesagt':'Anwesend'} (${anw.length})</p>
      ${anw.length ? anw.map(person).join('') : '<p class="empty">Noch niemand eingetragen.</p>'}
      ${leiter() && absagen.length ? `<p class="label">Abgesagt (${absagen.length})</p>${absagen.map(person).join('')}` : ''}
      <p class="label">Übungen dieser Probe (${plan.length})</p>
      ${plan.length ? plan.map(s=>`<div class="row" style="min-height:0"><button class="grow t" style="text-align:left" onclick="go('ueDetail',{id:'${s.id}'})">${esc(s.titel)}${tnText(s)?`<span class="pill">${esc(tnText(s))}</span>`:''}</button>${leiter()?`<button class="ib" onclick="planToggle('${p.id}','${s.id}')" aria-label="Entfernen">✕</button>`:''}</div>`).join('') : '<p class="empty">Noch keine Übungen eingeplant.</p>'}
      ${leiter() ? `<button class="btn red" onclick="go('planWaehlen',{id:'${p.id}'})">${IC.plus} Übung hinzufügen</button>` : ''}
    </div>`
  };
};
SCREENS.planWaehlen = c => {
  const p = D.proben.find(x => x.id === c.id);
  const kats = katListe(UE_KATS, false);
  if(!kats.includes(UI.planKat)) UI.planKat = kats[0];
  const liste = D.spiele.filter(s => !istVorgabe(s) && s.kat === UI.planKat);
  return {title:'Übungen auswählen',
    body:`<div class="wrap"><div class="tabs">${kats.map(k=>`<button class="${k===UI.planKat?'on':''}" onclick="UI.planKat='${esc(k)}';render()">${esc(k)}</button>`).join('')}</div>
    ${liste.map(u=>{ const drin = p.plan.includes(u.id); return `<button class="row" onclick="planToggle('${p.id}','${u.id}')"><div class="grow t">${esc(u.titel)}${tnText(u)?`<span class="pill">${esc(tnText(u))}</span>`:''}</div><span class="avatar" style="width:30px;height:30px;font-size:16px;${drin?'background:var(--red);color:#fff':''}">${drin?'✓':'+'}</span></button>`; }).join('') || '<p class="empty">Keine Übungen in dieser Kategorie.</p>'}</div>`,
    cta:`<button class="btn" onclick="back()">Fertig (${p.plan.length} ausgewählt)</button>`};
};
async function planToggle(probeId, spielId){
  const p = D.proben.find(x => x.id === probeId);
  const alt = p.plan;
  const neu = alt.includes(spielId) ? alt.filter(x => x !== spielId) : alt.concat([spielId]);
  p.plan = neu; render();
  const r = await api('probe', {probeId, ausgefallen:p.ausgefallen, grund:p.grund, anwesend:p.anwesend, plan:neu});
  if(!r.ok){ p.plan = alt; render(); return toast(r.msg || 'Konnte nicht gespeichert werden'); }
  render();
}

/* ----- Übungen ----- */
const UE_KATS = ['2er','3er','Gruppe','Warm-Up'];
const VO_KATS = ['Ticks','Tätigkeiten','Phobien','Orte','Rekorde','Hobbys','Genre','Gefühle','Beziehungen','Berufe','Persönlichkeiten'];
const istVorgabe = s => s.art === 'vorgabe';
function katListe(fest, vorgabe){
  const extra = [...new Set(D.spiele.filter(s => istVorgabe(s) === vorgabe).map(s => s.kat))].filter(k => k && !fest.includes(k));
  return fest.concat(extra);
}

function bildGewaehlt(inp){
  const f = inp.files && inp.files[0]; if(!f) return;
  const url = URL.createObjectURL(f); const img = new Image();
  img.onerror = () => toast('Dieses Bild kann ich nicht lesen.');
  img.onload = async () => {
    const S = 160, cv = document.createElement('canvas'); cv.width = cv.height = S;
    const m = Math.min(img.width, img.height);
    cv.getContext('2d').drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, S, S);
    URL.revokeObjectURL(url);
    toast('Bild wird gespeichert …');
    const r = await api('profil', {nachname:ich().nachname, bild:cv.toDataURL('image/jpeg', 0.7)});
    if(!r.ok) return toast(r.msg); render(); toast('Bild gespeichert');
  };
  img.src = url;
}

const BILD_FELDER = [
  ['kachelUebungen','Kachel „Übungen“','kachel',360,360],
  ['kachelVorgaben','Kachel „Vorgaben“','kachel',360,360],
  ['kachelProben','Kachel „Bisherige Proben“','kachel',720,192],

SCREENS.bilderStart = () => {

  return {title:'Bilder der Startseite', body:`<div class="wrap">
    <p class="muted" style="margin:0">Wähle für jede Stelle ein Bild aus deinen Fotos. Es wird automatisch zugeschnitten und verkleinert.</p>
    <input type="file" id="bildStartIn" accept="image/*" hidden onchange="bildStartGewaehlt(this)">
    ${BILD_FELDER.map(f=>`<div class="card"><div style="font-weight:600;margin-bottom:8px">${f[1]}</div>
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:${f[2]==='icon'?64:f[0]==='kachelProben'?150:84}px;height:64px;border-radius:12px;border:1px solid var(--line);background:${E[f[0]]?`center/${f[2]==='icon'?'contain':'cover'} no-repeat url('${E[f[0]]}')`:'var(--field)'}"></div>
        <button class="btn sm" onclick="UI.bildKey='${f[0]}';$('#bildStartIn').click()">${E[f[0]]?'Ändern':'Bild wählen'}</button>
        ${E[f[0]]?`<button class="btn sm" onclick="bildStartEntfernen('${f[0]}')">Entfernen</button>`:''}</div></div>`).join('')}</div>`};
};
function bildStartGewaehlt(inp){
  const f = inp.files && inp.files[0]; const key = UI.bildKey; inp.value = '';
  if(!f || !key) return;
  const feld = BILD_FELDER.find(x => x[0] === key);
  const url = URL.createObjectURL(f); const img = new Image();
  img.onerror = () => toast('Dieses Bild kann ich nicht lesen.');
  img.onload = async () => {
    let w = feld[3], h = feld[4], q = 0.72, data = '';
    for(let i = 0; i < 6; i++){
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const x = cv.getContext('2d');
      if(feld[2] === 'icon'){
        const s = Math.min(w/img.width, h/img.height); const bw = img.width*s, bh = img.height*s;
        x.drawImage(img, (w-bw)/2, (h-bh)/2, bw, bh); data = cv.toDataURL('image/png');
      } else {
        const s = Math.max(w/img.width, h/img.height); const bw = img.width*s, bh = img.height*s;
        x.drawImage(img, (w-bw)/2, (h-bh)/2, bw, bh); data = cv.toDataURL('image/jpeg', q);
      }
      if(data.length < 44000) break;
      w = Math.round(w*0.8); h = Math.round(h*0.8); q -= 0.08;
    }
    URL.revokeObjectURL(url);
    if(data.length >= 44000) return toast('Das Bild ist zu groß, bitte ein anderes wählen.');
    toast('Bild wird gespeichert …');
    const r = await api('einstellung', {key, wert:data});
    if(!r.ok) return toast(r.msg); render(); toast('Gespeichert');
  };
  img.src = url;
}

  const r = await api('einstellung', {key, wert:''});

SCREENS.teilnehmerVerwalten = () => ({title:'Teilnehmer',
  right: `<button class="ib" onclick="teilnehmerHinzu()" aria-label="Hinzufügen">＋</button>`,
  body: `<div class="wrap">${D.mitglieder.map(m=>`<button class="row" onclick="go('mitgliedEdit',{id:'${m.id}'})"><div class="grow">${esc(anzeige(m))}${m.gruppenleiter?' <span class="pill">Gruppenleiter</span>':''}${!m.aktiv?' <span class="pill">inaktiv</span>':''}<div class="s">Mitglied seit ${esc(m.seit||'–')}</div></div><span class="chev">›</span></button>`).join('')}</div>`});
function teilnehmerHinzu(){
  sheet(`<h2>Teilnehmer hinzufügen</h2><input class="field" id="nVor" placeholder="Vorname"><input class="field" id="nNach" placeholder="Nachname (optional)"><input class="field" id="nSeit" placeholder="Mitglied seit, z. B. 04.11.2026">
    <button class="btn red" onclick="teilnehmerAnlegen()">Anlegen</button><button class="btn" onclick="closeSheet()">Abbrechen</button>`);
}
async function teilnehmerAnlegen(){
  const v = ($('#nVor').value||'').trim(); if(!v) return toast('Bitte Vornamen eingeben');
  const r = await api('mitgliedNeu', {vorname:v, nachname:$('#nNach').value.trim(), seit:$('#nSeit').value.trim()});
  closeSheet(); if(!r.ok) return toast(r.msg); await laden(); render(); toast('Teilnehmer angelegt');
}
SCREENS.mitgliedEdit = c => { const m = mit(c.id); return {title: anzeige(m), body:`<div class="wrap">
  <p class="label">Vorname</p><input class="field" id="eVor" value="${esc(m.vorname)}">
  <p class="label">Nachname</p><input class="field" id="eNach" value="${esc(m.nachname)}">
  <p class="label">Mitglied seit</p><input class="field" id="eSeit" value="${esc(m.seit)}">
  <p class="label">E-Mail-Adresse</p><input class="field" id="eMail" type="email" value="${esc(m.mail)}">
  <p class="label">Telefonnummer</p><input class="field" id="eTel" type="tel" value="${esc(m.tel)}">
  <p class="label">Chat-Kanal</p><select class="field" id="eChatTyp">${[['','keiner'],['whatsapp','WhatsApp'],['signal','Signal'],['sms','SMS']].map(([v,t])=>`<option value="${v}" ${m.chatTyp===v?'selected':''}>${t}</option>`).join('')}</select>
  <input class="field" id="eChatWert" placeholder="Nummer für den Chat" value="${esc(m.chatWert)}">
  <p class="label">Notiz (nur für dich sichtbar)</p><textarea class="field" id="eNotiz">${esc(m.notiz)}</textarea>
  <label class="row" style="min-height:0"><span class="grow">Aktiv</span><input type="checkbox" id="eAktiv" ${m.aktiv?'checked':''}></label>
  <button class="btn red" onclick="mitgliedSpeichern('${m.id}')">Speichern</button>
  ${m.gruppenleiter?'':`<button class="btn" onclick="pinReset('${m.id}')">PIN zurücksetzen</button>`}</div>`}; };
async function mitgliedSpeichern(id){
  const f = {vorname:$('#eVor').value.trim(), nachname:$('#eNach').value.trim(), seit:$('#eSeit').value.trim(), mail:$('#eMail').value.trim(), tel:$('#eTel').value.trim(), chatTyp:$('#eChatTyp').value, chatWert:$('#eChatWert').value.trim(), notiz:$('#eNotiz').value, aktiv:$('#eAktiv').checked};
  const r = await api('mitglied', {mitglied:{id, ...f}});
  if(!r.ok) return toast(r.msg); await laden(); toast('Gespeichert'); back();
}
async function pinReset(mid){ const r = await api('pinReset', {mid}); toast(r.ok?'Die Person wählt beim nächsten Mal eine neue PIN':r.msg); }

SCREENS.anfragen = () => { const l = D.vorschlaege.filter(v=>v.typ==='teilnehmer-anfrage');
  return {title:'Neue Teilnehmer', body:`<div class="wrap">${l.length ? l.map(v=>`<div class="card"><b>${esc(v.titel)}</b>
    <div class="grid2" style="margin-top:10px"><button class="btn ok sm" onclick="vPruefen('${v.id}','uebernehmen')">Bestätigen</button><button class="btn sm" onclick="vPruefen('${v.id}','ablehnen')">Ablehnen</button></div></div>`).join('') : '<p class="empty">Keine offenen Anfragen.</p>'}</div>`}; };
SCREENS.vorschlaege = () => { const l = D.vorschlaege.filter(v=>v.typ!=='teilnehmer-anfrage');
  return {title:'Vorschläge', body:`<div class="wrap">${l.length ? l.map(v=>`<div class="card"><b>${esc(v.titel)}</b> <span class="pill">${esc(v.typ)}</span>
    <div class="muted">${esc(v.kategorie)}${v.von?' · von '+esc(v.von):''}</div>
    ${v.beschr?`<div class="s" style="white-space:pre-wrap;margin-top:6px">${esc(v.beschr)}</div>`:''}
    <div class="grid2" style="margin-top:10px"><button class="btn ok sm" onclick="vPruefen('${v.id}','uebernehmen')">Übernehmen</button><button class="btn no sm" onclick="vPruefen('${v.id}','ablehnen')">Ablehnen</button></div></div>`).join('') : '<p class="empty">Keine offenen Vorschläge.</p>'}</div>`}; };
async function vPruefen(vid, aktion){
  const r = await api('vorschlagPruefen', {vid, aktion}); if(!r.ok) return toast(r.msg);
  await laden(); render(); toast(aktion==='uebernehmen'?'Übernommen':'Abgelehnt');
}

function spielNeuSheet(){
  sheet(`<h2>Neu anlegen</h2>
    <select class="field" id="sArt"><option value="spiel">Spiel</option><option value="uebung">Übung</option></select>
    <input class="field" id="sTitel" placeholder="Titel"><input class="field" id="sKat" placeholder="Kategorie (z. B. 2er, Warm-Up)">
    <textarea class="field" id="sAblauf" placeholder="Ablauf (optional)"></textarea>
    <button class="btn red" onclick="spielNeuSpeichern()">Speichern</button><button class="btn" onclick="closeSheet()">Abbrechen</button>`);
}
async function spielNeuSpeichern(){
  const t = $('#sTitel').value.trim(); if(!t) return toast('Bitte einen Titel eingeben');
  const r = await api('spielNeu', {titel:t, kat:$('#sKat').value.trim(), art:$('#sArt').value, ablauf:$('#sAblauf').value});
  closeSheet(); if(!r.ok) return toast(r.msg); await laden(); render(); toast('Angelegt');
}

SCREENS.probeEdit = c => {
  const p = D.proben.find(x => x.id === c.id);
  const wuensche = D.wuensche.filter(w => w.probeId === p.id);
  return {title: 'Probe '+dKurz(p.datum), body: `<div class="wrap">
    <div class="card"><label class="row" style="min-height:0"><span class="grow">Probe fällt aus</span>
      <input type="checkbox" id="pAus" ${p.ausgefallen?'checked':''} onchange="document.getElementById('pGrundBox').style.display=this.checked?'block':'none'"></label>
      <div id="pGrundBox" style="display:${p.ausgefallen?'block':'none'};margin-top:10px"><p class="label">Begründung (wird den Teilnehmern angezeigt)</p>
      <textarea class="field" id="pGrund">${esc(p.grund)}</textarea></div></div>
    <p class="label">Anwesende</p>
    ${D.mitglieder.filter(m=>m.aktiv && !m.gruppenleiter || m.gruppenleiter).map(m=>`<label class="row" style="min-height:48px;padding:10px 14px"><span class="grow">${esc(anzeige(m))}</span><input type="checkbox" class="anw" value="${m.id}" ${p.anwesend.includes(m.id)?'checked':''}></label>`).join('')}
    <p class="label">Übungen dieser Probe</p>
    ${p.plan.map(id=>{const s=D.spiele.find(x=>x.id===id); return s?`<div class="row" style="min-height:0;justify-content:space-between"><span>${esc(s.titel)}</span><button class="ib" onclick="planAendern('${p.id}','${s.id}',false)">🗑️</button></div>`:''}).join('')}
    <button class="btn" onclick="planWahl('${p.id}')">＋ Übung zur Probe hinzufügen</button>
    ${wuensche.length?`<p class="label">Wünsche der Teilnehmer</p><div class="card">${wuensche.map(w=>{const s=D.spiele.find(x=>x.id===w.spielId), m=mit(w.mitgliedId); return s&&m?`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px"><span>${esc(anzeige(m))}: ${esc(s.titel)} ${w.wunsch==='hass'?'👎':'👍'}</span><button class="btn sm" onclick="planAendern('${p.id}','${s.id}',true)">＋ Plan</button></div>`:''}).join('')}</div>`:''}
    <button class="btn red" onclick="probeSpeichern('${p.id}')">Speichern</button></div>`};
};
async function probeSpeichern(id){
  const aus = $('#pAus').checked;
  const anwesend = [...document.querySelectorAll('.anw')].filter(c=>c.checked).map(c=>c.value);
  const p = D.proben.find(x=>x.id===id);
  const r = await api('probe', {probeId:id, ausgefallen:aus, grund:aus?$('#pGrund').value.trim():'', anwesend, plan:p.plan});
  if(!r.ok) return toast(r.msg); await laden(); toast('Gespeichert'); back();
}
async function planAendern(probeId, spielId, hinzu){
  const p = D.proben.find(x=>x.id===probeId);
  let plan = p.plan.filter(x=>x!==spielId);
  if(hinzu) plan.push(spielId);
  const r = await api('probe', {probeId, ausgefallen:p.ausgefallen, grund:p.grund, anwesend:p.anwesend, plan});
  if(!r.ok) return toast(r.msg); closeSheet(); await laden(); render();
}
function planWahl(probeId){
  sheet(`<h2>Übung zur Probe</h2>` + D.spiele.filter(s=>s.art!=='vorgabe').map(s=>`<button class="row" onclick="planAendern('${probeId}','${s.id}',true)"><div class="grow">${esc(s.titel)}</div></button>`).join('') + `<button class="btn" onclick="closeSheet()">Abbrechen</button>`);
}

/* ===== Start ===== */
async function init(){
  if(SESSION){
    await laden();
    if(D) { stack=[{s:'home'}]; }
  } else {
    NAMEN = [];
  }
  render();
}
init().catch(e=>{ render(); toast('Fehler: '+e.message); });
</script>
</body>
</html>
