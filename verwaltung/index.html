<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Verwaltung – Impro-Fundus</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--red:#B02E28;--bg:#F5F0E8;--card:#FFFFFF;--field:#FFFFFF;--line:#E6DFD4;--fg:#1F1B17;--muted:#6F665D;--ok:#2E7D4F;--chip:#EFE7DA;--overlay:rgba(0,0,0,.45);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--red:#D8564F;--bg:#1A1714;--card:#2A2622;--field:#2A2622;--line:#3A342E;--fg:#F3ECE3;--muted:#ABA196;--ok:#59C187;--chip:#38322C;--overlay:rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:60px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.top img{height:40px;width:auto;display:block}
.top h1{font:700 26px Caveat,cursive;margin:0;color:var(--red);flex:1;min-width:120px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--fg)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.small{padding:5px 10px;font-size:14px;border-radius:9px}
.btn.del{color:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;cursor:pointer;white-space:nowrap;font-weight:600}
.tabs button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.panel h2{margin:0 0 10px;font-size:19px}
.panel h3{margin:18px 0 8px;font-size:16px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input[type=search]{flex:1;min-width:180px}
input,select,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{min-height:130px;resize:vertical}
label{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted)}
label.check{flex-direction:row;align-items:center;gap:10px;color:var(--fg);font-size:15px}
label.check input{width:18px;height:18px;flex:none}
.form{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{margin:0;color:var(--muted);font-size:14px;min-height:1.2em}
.msg.err{color:var(--red)}
.msg.ok{color:var(--ok)}
details.grp{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--bg)}
details.grp>summary{cursor:pointer;font-weight:700;padding:10px 12px;display:flex;gap:8px;align-items:baseline}
details.grp>summary .n{color:var(--muted);font-weight:400;font-size:14px}
.item{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);background:var(--card)}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item .m{color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;background:var(--chip);color:var(--muted);margin-left:6px}
.pill.draft{background:#fff3d6;color:#7a5a00}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.empty{color:var(--muted);padding:10px 2px}
.login{max-width:420px;margin:12vh auto 0}
.login .panel{padding:22px}
.login img{height:72px;width:auto;display:block;margin:0 auto 6px}
.login h1{font:700 32px Caveat,cursive;text-align:center;margin:0 0 14px;color:var(--red)}
.dlg{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:50}
.dlg[hidden]{display:none}
.dlgbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;width:100%;max-width:560px}
.dlgbox h2{margin:0 0 12px;font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}.item{flex-wrap:wrap}}
.hint{color:var(--muted);font-size:14px;margin:0 0 10px}
.stkwrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stk{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stk span{color:var(--muted);font-size:13px}
.stk strong{font-size:28px;line-height:1.1}
.stk small{color:var(--muted);font-size:12px}
.saeulen{display:flex;align-items:flex-end;gap:3px;height:120px;padding:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.sae{flex:1;height:100%;display:flex;align-items:flex-end}
.sae i{display:block;width:100%;background:var(--red);border-radius:3px 3px 0 0}
.saeulenfuss{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:4px}
.tabw{overflow-x:auto}
.stt{width:100%;border-collapse:collapse;font-size:15px}
.stt th,.stt td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
.stt th:first-child,.stt td:first-child{text-align:left}
.stt th{color:var(--muted);font-weight:600;font-size:13px}
.stt .m{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<div class="dlg" id="dlg" hidden><div class="dlgbox" id="dlgBox" role="dialog" aria-modal="true"></div></div>
<script>
/* Schnittstelle (Google Apps Script) – dieselbe wie auf der Website */
const API = "https://script.google.com/macros/s/AKfycbwcGZii-rdT7MHU_vxgWMGMFsZIuwUW96_ECA8vTRAzEk8RbPszsdT2Dh8CPYJSWgqM/exec";
const KEY = "fundus-verwaltung";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let TOKEN = null, RAW = null, ITEMS = [], VORG = {}, UKATS = [], ZIT = [], IDEEN = [];
let tab = "ueb", vcat = null, suche = "", gestartet = false;
try { TOKEN = sessionStorage.getItem(KEY); } catch (e) {}

async function api(obj) {
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ token: TOKEN }, obj)) });
  const d = await r.json();
  if (!d.ok && /erneut/.test(d.msg || "")) { abmelden(true); throw new Error("Bitte melde dich erneut an."); }
  return d;
}
function abmelden(abgelaufen) {
  TOKEN = null; RAW = null;
  try { sessionStorage.removeItem(KEY); } catch (e) {}
  closeDlg(); loginSeite(abgelaufen ? "Die Anmeldung ist abgelaufen. Bitte melde dich erneut an." : "");
}

/* ---------- Anmeldung ---------- */
function loginSeite(hinweis) {
  $("#app").innerHTML = `<div class="login wrap"><div class="panel"><img src="../logo.png" alt="Impro-Fundus"><h1>Verwaltung</h1>
    <form class="form" id="lf">
      <label>Benutzername<input id="ln" autocomplete="username" autocapitalize="none" required></label>
      <label>Passwort<input id="lp" type="password" autocomplete="current-password" required></label>
      <p class="msg err" id="lm">${esc(hinweis || "")}</p>
      <button class="btn red" type="submit">Anmelden</button>
    </form>
    <p class="hint" style="margin:14px 0 0;text-align:center"><a href="../" style="color:var(--muted)">← Zur Website</a></p></div></div>`;
  $("#ln").focus();
  $("#lf").onsubmit = async e => {
    e.preventDefault();
    const m = $("#lm"); m.className = "msg"; m.textContent = "Einen Moment …";
    try {
      const r = await (await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "adminAnmelden", name: $("#ln").value.trim(), passwort: $("#lp").value }) })).json();
      if (!r.ok) { m.className = "msg err"; m.textContent = r.msg || "Anmeldung nicht möglich."; return; }
      TOKEN = r.token; try { sessionStorage.setItem(KEY, TOKEN); } catch (x) {}
      await start();
    } catch (x) { m.className = "msg err"; m.textContent = "Keine Verbindung. Bitte später noch einmal versuchen."; }
  };
}

/* ---------- Daten ---------- */
function daten(d) {
  RAW = d; ZIT = Array.isArray(d.zitate) ? d.zitate : [];
  IDEEN = Array.isArray(d.ideen) ? d.ideen : [];
  UKATS = (d.uebungenReihe || []).slice();
  ITEMS = (d.uebungen || []).map(u => ({ id: u.id, cat: u.kat, title: u.titel, level: u.level || "", draft: u.entwurf === "1", ab: u.ablauf || "", dauer: u.dauer || "", tn: u.tn || "", eig: u.eig || [] }));
  ITEMS.forEach(i => { if (!UKATS.includes(i.cat)) UKATS.push(i.cat); });
  VORG = {};
  (d.vorgabenReihe || []).forEach(k => { VORG[k] = d.vorgaben[k] || []; });
  Object.keys(d.vorgaben || {}).forEach(k => { if (!VORG[k]) VORG[k] = d.vorgaben[k]; });
  if (!vcat || !VORG[vcat]) vcat = Object.keys(VORG)[0] || null;
}
async function laden() {
  const r = await api({ action: "fundusAdmin" });
  if (!r.ok) throw new Error(r.msg || "Die Daten konnten nicht geladen werden.");
  daten(r);
}
async function start() {
  try { localStorage.setItem("fundus-nicht-zaehlen", "1"); } catch (e) {}
  $("#app").innerHTML = `<div class="wrap"><p class="hint" style="padding-top:40px">Einen Moment, die Daten werden geladen …</p></div>`;
  try { await laden(); if (!gestartet) { gestartet = true; if (IDEEN.length) tab = "ide"; } seite(); }
  catch (x) { if (TOKEN) $("#app").innerHTML = `<div class="wrap"><div class="panel"><p class="msg err">${esc(x.message)}</p><div class="row"><button class="btn" onclick="start()">Noch einmal versuchen</button><button class="btn" onclick="abmelden()">Abmelden</button></div></div></div>`; }
}
async function aktion(obj, nach) {
  const r = await api(obj);
  if (!r.ok) throw new Error(r.msg || "Das hat nicht geklappt.");
  await laden(); if (nach !== false) seite();
  return r;
}

/* ---------- Seitengerüst ---------- */
const TABS = [["ide", "Vorschläge"], ["ueb", "Übungen"], ["vor", "Vorgaben"], ["zit", "Zitate"], ["imp", "Import / Export"], ["sta", "Besucher"], ["adm", "Admins"]];
function seite() {
  const inhalt = { ide: tabIde, ueb: tabUeb, vor: tabVor, zit: tabZit, imp: tabImp, sta: tabSta, adm: tabAdm }[tab]();
  const alt = $("#suche"), hadFocus = alt && document.activeElement === alt, pos = hadFocus ? alt.selectionStart : 0;
  $("#app").innerHTML = `<div class="top"><div class="wrap"><img src="../logo.png" alt=""><h1>Verwaltung</h1><a class="btn" href="../" style="text-decoration:none">Zur Website</a><button class="btn" id="out">Abmelden</button></div></div>
    <div class="wrap"><div class="tabs" role="tablist">${TABS.map(([k, t]) => `<button role="tab" data-tab="${k}" aria-pressed="${tab === k}">${t}${k === "ide" && IDEEN.length ? ` <span class="pill" style="background:var(--red);color:#fff">${IDEEN.length}</span>` : ""}</button>`).join("")}</div>${inhalt}</div>`;
  $("#out").onclick = () => abmelden();
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; seite(); window.scrollTo(0, 0); });
  bindTab();
  if (hadFocus && $("#suche")) { $("#suche").focus(); $("#suche").setSelectionRange(pos, pos); }
}
function fehler(x) { alert(x && x.message ? x.message : "Das hat nicht geklappt."); }
function katVerwaltung(art, liste) {
  return `<h3>Kategorien</h3><p class="hint">Mit ← → änderst du die Reihenfolge. Löschen geht nur bei leeren Kategorien.</p>
  ${liste.map(k => `<div class="item" style="border:1px solid var(--line);border-radius:10px;margin-bottom:6px"><span class="t">${esc(k)}</span>
    <button class="btn small" data-kat="verschieben" data-art="${art}" data-name="${esc(k)}" data-dir="-1" title="nach vorn">←</button>
    <button class="btn small" data-kat="verschieben" data-art="${art}" data-name="${esc(k)}" data-dir="1" title="nach hinten">→</button>
    <button class="btn small" data-kat="umbenennen" data-art="${art}" data-name="${esc(k)}">umbenennen</button>
    <button class="btn small del" data-kat="loeschen" data-art="${art}" data-name="${esc(k)}">löschen</button></div>`).join("")}
  <button class="btn" data-kat="neu" data-art="${art}">+ Neue Kategorie</button>`;
}
function bindKat() {
  document.querySelectorAll("[data-kat]").forEach(b => b.onclick = async () => {
    const op = b.dataset.kat, art = b.dataset.art, name = b.dataset.name || "";
    try {
      if (op === "neu") { const n = prompt("Name der neuen Kategorie:"); if (n && n.trim()) await aktion({ action: "adminKat", op: "neu", art, name: n.trim() }); }
      else if (op === "umbenennen") { const n = prompt("Neuer Name für „" + name + "“:", name); if (n && n.trim() && n.trim() !== name) await aktion({ action: "adminKat", op: "umbenennen", art, name, neu: n.trim() }); }
      else if (op === "loeschen") { if (confirm("Kategorie „" + name + "“ wirklich löschen? Das geht nur, wenn sie leer ist.")) await aktion({ action: "adminKat", op: "loeschen", art, name }); }
      else if (op === "verschieben") await aktion({ action: "adminKat", op: "verschieben", art, name, richtung: +b.dataset.dir });
    } catch (x) { fehler(x); }
  });
}

/* ---------- Vorschläge von Besuchern ---------- */
const datumDe = iso => { const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}.${m[2]}.${m[1]}` : ""; };
function tabIde() {
  return `<div class="panel"><h2>Vorschläge von Besuchern</h2><p class="hint">Diese Vorschläge kamen über das Formular auf der Website (du hast sie zusätzlich per E-Mail bekommen). Mit „Übernehmen“ kannst du sie ansehen, ändern und hinzufügen. Danach verschwindet der Vorschlag aus dieser Liste.</p>
  ${IDEEN.map(i => {
    const z = i.art === "Zitat";
    const info = [i.art === "Vorgabe" ? "Vorgaben-Art: " + i.kat : i.art === "Übung" ? "Bereich: " + i.kat : "", i.tn ? i.tn + " Personen" : "", i.level, i.name ? "von " + i.name : "von anonym", i.nameNennen === "ja" ? "(Name darf genannt werden)" : "", datumDe(i.datum)].filter(Boolean).join(" · ");
    return `<div class="item" style="flex-direction:column;align-items:stretch;border:1px solid var(--line);border-radius:12px;margin-bottom:10px">
      <div><span class="pill" style="margin:0 8px 0 0">${esc(i.art)}</span><b>${esc(z ? "„" + i.text + "“" : i.titel)}</b>${z && i.titel ? ` — ${esc(i.titel)}` : ""}</div>
      <div class="m">${esc(info)}${i.mail ? ` · <a href="mailto:${esc(i.mail)}" style="color:inherit">${esc(i.mail)}</a>` : ""}</div>
      ${z ? "" : `<div style="white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border-radius:10px;padding:10px;max-height:220px;overflow:auto">${esc(i.text)}</div>`}
      <div class="row"><button class="btn red small" data-ide-ok="${esc(i.id)}">Übernehmen</button><button class="btn small del" data-ide-weg="${esc(i.id)}">Verwerfen</button></div></div>`;
  }).join("") || '<p class="empty">Keine neuen Vorschläge.</p>'}</div>`;
}
function zitatUebernehmen(idee) {
  openDlg(`<h2>Zitat übernehmen</h2><form class="form" id="zuForm"><label>Zitat<textarea id="zuT" required style="min-height:100px">${esc(idee.text)}</textarea></label>
    <label>Von wem (optional)<input id="zuA" value="${esc(idee.titel)}"></label>
    <p class="hint" style="margin:0">Eingereicht von: ${esc(idee.name || "anonym")}${idee.mail ? " (" + esc(idee.mail) + ")" : ""}</p><p class="msg" id="zuM"></p>
    <div class="row"><button class="btn red" type="submit">Als Zitat speichern</button><button class="btn" type="button" id="zuX">Abbrechen</button></div></form>`);
  $("#zuX").onclick = closeDlg;
  $("#zuForm").onsubmit = async e => {
    e.preventDefault(); const m = $("#zuM"); m.className = "msg"; m.textContent = "Einen Moment …";
    try {
      await aktion({ action: "adminZitat", op: "neu", t: $("#zuT").value.trim(), a: $("#zuA").value.trim() }, false);
      await aktion({ action: "adminIdeeLoeschen", id: idee.id }, false);
      closeDlg(); seite();
    } catch (x) { if (TOKEN) { m.className = "msg err"; m.textContent = x.message; } }
  };
}

/* ---------- Übungen ---------- */
function tabUeb() {
  const q = suche.trim().toLowerCase();
  const gruppen = UKATS.map(k => {
    const l = ITEMS.filter(i => i.cat === k && (!q || i.title.toLowerCase().includes(q)));
    if (q && !l.length) return "";
    return `<details class="grp" ${q ? "open" : ""}><summary>${esc(k)} <span class="n">${l.length}</span></summary>${l.map(i => `<div class="item"><span class="t">${esc(i.title)}${i.draft ? '<span class="pill draft">Entwurf</span>' : ""}${!i.ab ? '<span class="pill">ohne Beschreibung</span>' : ""}<div class="m">${esc([i.tn ? i.tn + " Pers." : "", i.dauer, i.level].filter(Boolean).join(" · "))}</div></span><button class="btn small" data-edit-u="${esc(i.id)}">Bearbeiten</button></div>`).join("") || '<div class="item"><span class="t m">Noch keine Übungen.</span></div>'}</details>`;
  }).join("");
  return `<div class="panel"><div class="bar"><input id="suche" type="search" placeholder="Übung suchen …" value="${esc(suche)}"><button class="btn red" data-new="uebung">+ Neue Übung</button></div>
    ${gruppen || '<p class="empty">Nichts gefunden.</p>'}${katVerwaltung("uebung", UKATS)}</div>`;
}

/* ---------- Vorgaben ---------- */
function tabVor() {
  const ks = Object.keys(VORG), l = VORG[vcat] || [];
  return `<div class="panel"><div class="chips">${ks.map(k => `<button data-vc="${esc(k)}" aria-pressed="${k === vcat}">${esc(k)} (${(VORG[k] || []).length})</button>`).join("")}</div>
    <div class="bar"><button class="btn red" data-new="vorgabe" ${vcat ? "" : "disabled"}>+ Vorgabe in „${esc(vcat || "–")}“</button></div>
    ${l.map(v => `<div class="item"><span class="t">${esc(v.t)}${v.entwurf === "1" ? '<span class="pill draft">Entwurf</span>' : ""}${v.h ? `<div class="m">${esc(v.h)}</div>` : ""}</span>
      <button class="btn small" data-vmove="${esc(v.id)}" data-dir="-1" title="nach oben">↑</button><button class="btn small" data-vmove="${esc(v.id)}" data-dir="1" title="nach unten">↓</button>
      <button class="btn small" data-edit-v="${esc(v.id)}">Bearbeiten</button></div>`).join("") || '<p class="empty">In dieser Kategorie gibt es noch keine Vorgaben.</p>'}
    ${katVerwaltung("vorgabe", ks)}</div>`;
}

/* ---------- Zitate ---------- */
function tabZit() {
  return `<div class="panel"><h2>Zitate</h2><p class="hint">Jeden Tag wird eines dieser Zitate auf der Startseite gezeigt. Aktuell: ${ZIT.length}.</p>
    ${ZIT.map(z => `<div class="item" style="border:1px solid var(--line);border-radius:10px;margin-bottom:6px"><span class="t">„${esc(z.t)}“${z.a ? " — " + esc(z.a) : ""}</span><button class="btn small" data-zedit="${esc(z.id)}">bearbeiten</button><button class="btn small del" data-zdel="${esc(z.id)}">löschen</button></div>`).join("") || '<p class="empty">Noch keine Zitate.</p>'}
    <h3 id="zTitel">Zitat hinzufügen</h3>
    <form class="form" id="zForm"><input type="hidden" id="zId"><label>Zitat<textarea id="zT" required style="min-height:90px"></textarea></label>
      <label>Von wem (optional)<input id="zA" placeholder="z. B. Keith Johnstone"></label>
      <div class="row"><button class="btn red" type="submit">Speichern</button><button class="btn" type="button" id="zNeu" hidden>Abbrechen</button></div></form>
    <h3>Mehrere auf einmal</h3>
    <form class="form" id="zMore"><label>Pro Zeile ein Zitat, Quelle mit | abtrennen<textarea id="zMany" placeholder="Zitat eins | Autorin&#10;Zitat zwei | Autor"></textarea></label>
      <div class="row"><button class="btn" type="submit">Alle hinzufügen</button></div></form>
    <p class="msg" id="zMsg"></p></div>`;
}

/* ---------- Import / Export ---------- */
function tabImp() {
  const nV = Object.values(VORG).reduce((a, x) => a + x.length, 0);
  return `<div class="panel"><h2>Export</h2><p class="hint">Speichert alle Übungen, Vorgaben (auch Entwürfe) und Zitate in einer Datei. So hast du eine Sicherung.</p>
    <button class="btn red" id="exp">Datei herunterladen (${ITEMS.length} Übungen, ${nV} Vorgaben)</button>

/* ---------- Besucher (Statistik und iPhone-Widget) ---------- */
let STAT = null, STAT_LAEDT = false, WIDGET_KEY = null;
const slugV = s => String(s ?? "").toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const tagMinus = (tag, n) => { const m = tag.split("-").map(Number); return new Date(Date.UTC(m[0], m[1] - 1, m[2] - n, 12)).toISOString().slice(0, 10); };
const zahl = n => Number(n || 0).toLocaleString("de-DE");
const tagDe = t => { const m = t.split("-"); return `${m[2]}.${m[1]}.`; };
function kw(tag) {
  const m = tag.split("-").map(Number), d = new Date(Date.UTC(m[0], m[1] - 1, m[2]));
  const n = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - n + 3);
  const j = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  return 1 + Math.round(((d - j) / 86400000 - 3 + ((j.getUTCDay() + 6) % 7)) / 7);
}
function seitenName(p) {
  const fest = { "/": "Startseite", "/uebungen/": "Übungen", "/alle-uebungen/": "Alle Übungen", "/vorgaben/": "Vorgaben", "/was-ist-impro/": "Was ist Impro?", "/ueber-den-fundus/": "Alles über den Fundus", "/kontakt/": "Kontakt", "/spenden/": "Spenden", "/vorschlag-einreichen/": "Vorschlag einreichen", "/impressum/": "Impressum", "/datenschutz/": "Datenschutz", "/nutzungsbedingungen/": "Nutzungsbedingungen", "/suche/": "Suche" };
  if (fest[p]) return fest[p];
  const t = p.split("/").filter(Boolean);
  if (t[0] === "uebung") { const i = ITEMS.find(x => slugV(x.title) === t[1] || slugV(x.title + " " + x.id) === t[1]); return i ? "Übung: " + i.title : "Übung: " + t[1]; }
  if (t[0] === "uebungen") return "Kategorie: " + (UKATS.find(k => slugV(k.replace("Zweierübungen", "2er-Übungen").replace("Dreierübungen", "3er-Übungen")) === t[1]) || t[1]);
  if (t[0] === "vorgaben") return "Vorgaben: " + (Object.keys(VORG).find(k => slugV(k) === t[1]) || t[1]);
  return p;
}
function tabSta() {
  if (!STAT) return `<div class="panel"><h2>Besucher</h2><p class="hint">Die Zahlen werden geladen …</p></div>`;
  const h = STAT.heute, T = STAT.tage;
  const summe = (von, bis) => { let b = 0, a = 0; for (let i = von; i <= bis; i++) { const t = T[tagMinus(h, i)]; if (t) { b += t.b; a += t.a; } } return { b, a }; };
  const kachel = (name, v) => `<div class="stk"><span>${name}</span><strong>${zahl(v.b)}</strong><small>${zahl(v.a)} Seitenaufrufe</small></div>`;
  const tage30 = [];
  for (let i = 29; i >= 0; i--) { const d = tagMinus(h, i), t = T[d] || { b: 0, a: 0 }; tage30.push({ d, ...t }); }
  const max = Math.max(1, ...tage30.map(x => x.b));
  const saeulen = tage30.map(x => `<div class="sae" title="${tagDe(x.d)}: ${x.b} Besuche, ${x.a} Seitenaufrufe"><i style="height:${Math.max(2, Math.round(x.b / max * 100))}%"></i></div>`).join("");
  // Wochen (Montag bis Sonntag)
  const m = h.split("-").map(Number), wt = (new Date(Date.UTC(m[0], m[1] - 1, m[2])).getUTCDay() + 6) % 7;
  const wochen = [];
  for (let i = 0; i < 8; i++) {
    const startTag = tagMinus(h, wt + i * 7), endTag = tagMinus(h, Math.max(0, wt + i * 7 - 6));
    const s = summe(i === 0 ? 0 : wt + (i - 1) * 7 + 1, wt + i * 7);
    wochen.push(`<tr><td>KW ${kw(startTag)} <span class="m">${tagDe(startTag)}–${tagDe(endTag)}</span></td><td>${zahl(s.b)}</td><td>${zahl(s.a)}</td></tr>`);
  }
  // Monate
  const MON = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
  const proMonat = {};
  Object.keys(T).forEach(d => { const k = d.slice(0, 7), o = proMonat[k] || (proMonat[k] = { b: 0, a: 0 }); o.b += T[d].b; o.a += T[d].a; });
  const monate = [];
  for (let i = 0; i < 12; i++) {
    const d = new Date(Date.UTC(m[0], m[1] - 1 - i, 1)), k = d.toISOString().slice(0, 7);
    if (i > 0 && STAT.seit && k < STAT.seit.slice(0, 7)) break;
    const o = proMonat[k] || { b: 0, a: 0 };
    monate.push(`<tr><td>${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}</td><td>${zahl(o.b)}</td><td>${zahl(o.a)}</td></tr>`);
  }
  const top = STAT.top.length ? STAT.top.map(t => `<tr><td>${esc(seitenName(t.pfad))}</td><td>${zahl(t.a)}</td></tr>`).join("") : `<tr><td colspan="2" class="empty">Noch keine Daten.</td></tr>`;
  const tr = "<thead><tr><th></th><th>Besuche</th><th>Seitenaufrufe</th></tr></thead>";
  return `<div class="panel"><h2>Besucher</h2>
    <p class="hint">${STAT.seit ? "Gezählt wird seit dem " + datumDe(STAT.seit) + "." : "Es wurde noch nichts gezählt."} <b>Besuche</b> sind Aufrufe der Website (jedes Öffnen oder Neuladen). <b>Seitenaufrufe</b> zählen jede angesehene Seite, auch beim Weiterklicken. Gezählt wird anonym: ohne Cookies und ohne IP-Adresse, deshalb lassen sich einzelne Personen nicht unterscheiden. Deine eigenen Besuche zählen nicht, wenn du dich auf diesem Gerät hier angemeldet hast.</p>
    <div class="stkwrap">${kachel("Heute", summe(0, 0))}${kachel("Gestern", summe(1, 1))}${kachel("Letzte 7 Tage", summe(0, 6))}${kachel("Letzte 30 Tage", summe(0, 29))}${kachel("Gesamt", { b: STAT.gesamt.b, a: STAT.gesamt.a })}</div>
    <h3>Besuche pro Tag (letzte 30 Tage)</h3><div class="saeulen">${saeulen}</div><div class="saeulenfuss"><span>${tagDe(tage30[0].d)}</span><span>Heute</span></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="statNeu">Aktualisieren</button></div></div>
    <div class="panel"><h3 style="margin-top:0">Pro Woche</h3><div class="tabw"><table class="stt">${tr}<tbody>${wochen.join("")}</tbody></table></div>
    <h3>Pro Monat</h3><div class="tabw"><table class="stt">${tr}<tbody>${monate.join("")}</tbody></table></div></div>
    <div class="panel"><h3 style="margin-top:0">Beliebteste Seiten (letzte 30 Tage)</h3><div class="tabw"><table class="stt"><thead><tr><th></th><th>Aufrufe</th></tr></thead><tbody>${top}</tbody></table></div></div>
    <div class="panel"><h2>Widget auf dem iPhone</h2>${widgetHTML()}</div>`;
}

  });
  $("#zNeu").onclick = () => { $("#zId").value = ""; $("#zT").value = ""; $("#zA").value = ""; $("#zTitel").textContent = "Zitat hinzufügen"; $("#zNeu").hidden = true; };
  document.querySelectorAll("[data-zdel]").forEach(b => b.onclick = () => { if (confirm("Dieses Zitat wirklich löschen?")) senden({ action: "adminZitat", op: "loeschen", id: b.dataset.zdel }); });
}
function bindImp() {
  $("#exp").onclick = () => {
    if (!RAW) return;
    const out = Object.assign({}, RAW); delete out.ok;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: "application/json" }));
    a.download = "impro-fundus-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  $("#impForm").onsubmit = async e => {
    e.preventDefault();
    const msg = (t, c) => { const m = $("#impMsg"); m.className = "msg " + (c || ""); m.textContent = t; };
    const f = $("#impFile").files[0];
    if (!f) { msg("Bitte zuerst eine Datei wählen.", "err"); return; }
    let d; try { d = JSON.parse(await f.text()); } catch (x) { msg("Die Datei kann nicht gelesen werden. Ist es eine Export-Datei?", "err"); return; }
    if (!d || (!Array.isArray(d.uebungen) && !d.vorgaben && !Array.isArray(d.zitate))) { msg("In der Datei wurden keine Übungen, Vorgaben oder Zitate gefunden.", "err"); return; }
    const anz = (d.uebungen || []).length + Object.values(d.vorgaben || {}).reduce((a, x) => a + x.length, 0);
    if (!confirm(anz + " Einträge aus der Datei importieren?")) return;
    msg("Einen Moment …");
    try { const r = await api({ action: "adminImport", daten: d }); if (!r.ok) { msg(r.msg || "Das hat nicht geklappt.", "err"); return; } await laden(); seite(); const m = $("#impMsg"); if (m) { m.className = "msg ok"; m.textContent = "Fertig: " + r.neu + " neu, " + r.aktualisiert + " aktualisiert, " + r.zitate + " neue Zitate."; } }
    catch (x) { if (TOKEN) msg("Keine Verbindung oder die Datei ist zu groß.", "err"); }
  };
}
function bindAdm() {
  admListe();
  $("#admNeu").onsubmit = async e => {
    e.preventDefault();
    const m = $("#am2"), n = $("#an2").value.trim(), p = $("#ap2").value;
    m.className = "msg"; m.textContent = "Einen Moment …";
    try { const r = await api({ action: "adminHinzufuegen", name: n, passwort: p }); if (!r.ok) throw new Error(r.msg || "Das hat nicht geklappt."); $("#an2").value = ""; $("#ap2").value = ""; m.className = "msg ok"; m.textContent = `Admin „${n}“ gespeichert.`; admListe(); }
    catch (x) { m.className = "msg err"; m.textContent = x.message; }
  };
}

if (TOKEN) start(); else loginSeite();
</script>
