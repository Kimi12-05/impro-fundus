<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B02E28">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/fundus.webmanifest">
<meta name="apple-mobile-web-app-title" content="Impro-Fundus">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="{{BESCHREIBUNG}}">
<title>{{TITEL}}</title>
<link rel="canonical" href="{{CANONICAL}}">
<meta name="robots" content="{{ROBOTS}}">
<meta property="og:type" content="website">
<meta property="og:locale" content="de_DE">
<meta property="og:site_name" content="Impro-Fundus">
<meta property="og:title" content="{{TITEL}}">
<meta property="og:description" content="{{BESCHREIBUNG}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="https://impro-fundus.de/icon-512.png">
<meta name="twitter:card" content="summary">
{{JSONLD}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;700&family=Indie+Flower&family=Architects+Daughter&family=Coming+Soon&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css?v={{VERSION}}">
</head>
<body>
<div class="topwrap">
<header class="top">
  <button class="iconbtn menu-btn" id="menuBtn" aria-label="Menü öffnen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <button class="logo" data-go="start" aria-label="Zur Startseite"><img src="/logo.png" alt="Impro-Fundus"></button>
  <nav class="topnav" id="topnav" aria-label="Hauptmenü">{{TOPNAV}}</nav>
  <div class="rightbox">
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" class="qin" type="search" placeholder="Spiel oder Vorgabe suchen" aria-label="Suchen">
  </label>
  </div>
</header>
</div>

<div class="shell">
  <aside class="side" id="side" aria-label="Hauptmenü"></aside>
  <main id="main"{{MAINATTR}}>{{MAIN}}</main>
</div>

<aside class="drawer" id="drawer" aria-label="Menü">{{DRAWER}}</aside>
<div class="scrim" id="scrim" hidden></div>
<nav class="bottom" id="bottom" aria-label="Schnellmenü"></nav>
<div class="dlg" id="dlg" hidden><div class="dlg-box" id="dlgBox" role="dialog" aria-modal="true"></div></div>

<script src="/site.js?v={{VERSION}}"></script>
</body>
</html>
